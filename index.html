<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TORA TODO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #FDFAF7; --bg2: #F2EDE6; --bg3: #EBE5DC;
  --accent: #C4603A; --accent-light: #C4603A14;
  --green: #2D3B2E; --text: #2D3B2E; --text2: #6B7B6C; --text3: #9AA59B;
  --white: #ffffff; --sep: rgba(45,59,46,0.08);
  --radius: 12px; --radius-sm: 8px;
  --font: 'DM Sans', -apple-system, sans-serif;
  --font-num: 'Bebas Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; margin: 0 auto; }

/* AUTH */
#auth-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
.auth-logo { font-family: var(--font-num); font-size: 44px; color: var(--accent); letter-spacing: .05em; margin-bottom: 4px; }
.auth-sub { font-size: 11px; color: var(--text3); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 40px; }
.auth-card { background: var(--white); border-radius: var(--radius); border: 0.5px solid var(--sep); padding: 28px 24px; width: 100%; max-width: 360px; }
.auth-title { font-size: 14px; font-weight: 500; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
.field input { width: 100%; height: 42px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--bg); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.field input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; transition: opacity .2s; }
.btn-primary:active { opacity: .8; }
.auth-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text3); }
.auth-toggle a { color: var(--accent); cursor: pointer; }
.auth-err { font-size: 12px; color: var(--accent); margin-top: 10px; text-align: center; min-height: 18px; }

/* APP */
#app { display: none; flex-direction: column; height: 100vh; }
.header { position: sticky; top: 0; z-index: 100; background: rgba(253,250,247,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0.5px solid var(--sep); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
.header-logo { font-family: var(--font-num); font-size: 22px; color: var(--accent); letter-spacing: .06em; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-date { font-size: 11px; color: var(--text3); }
.btn-logout { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font); }

/* PC NAV */
.pc-nav { display: none; gap: 4px; }
.pc-nav-item { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text3); font-weight: 500; transition: all .15s; border: none; background: none; font-family: var(--font); }
.pc-nav-item:hover { background: var(--bg2); color: var(--text); }
.pc-nav-item.active { background: var(--accent-light); color: var(--accent); }
.pc-nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
kbd { display: inline-block; padding: 1px 5px; border: 0.5px solid var(--bg3); border-radius: 3px; font-size: 10px; font-family: var(--font); background: var(--bg2); color: var(--text2); }

@media (min-width: 900px) {
  .app-body { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; }
  .main { padding: 20px 24px 24px; overflow-y: auto; }
  .right-panel { border-left: 0.5px solid var(--sep); background: var(--white); overflow-y: auto; padding: 20px; display: block !important; }
  .nav { display: none; }
  .pc-nav { display: flex !important; }
}

.app-body { display: flex; flex: 1; overflow: hidden; }
.main { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }
.right-panel { display: none; }

/* MOBILE NAV */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(242,237,230,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 0.5px solid var(--sep); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 14px; border-radius: 8px; }
.nav-item:active { background: var(--bg3); }
.nav-icon { width: 22px; height: 22px; }
.nav-label { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); font-weight: 500; }
.nav-item.active .nav-label { color: var(--accent); }

/* PAGE */
.page { display: none; }
.page.active { display: block; }
.sec-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 10px; margin-top: 20px; }
.sec-label:first-child { margin-top: 4px; }

/* BUFFER BAR */
.buffer-bar { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 4px; }
.buffer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.buffer-label { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; }
.buffer-nums { font-family: var(--font-num); font-size: 14px; color: var(--text2); letter-spacing: .04em; }
.buffer-nums span { color: var(--accent); }
.buffer-track { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.buffer-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.buffer-fill.warn { background: #E8433A; }

/* NEXT ACTION */
.next-action { background: var(--accent); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.next-action-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 4px; }
.next-action-title { font-size: 15px; font-weight: 500; color: white; }
.next-action-meta { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 2px; }
.next-action-icon { width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* TODAY 3 GOALS */
.goals-wrap { display: flex; flex-direction: column; gap: 6px; }
.goal-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.goal-circle { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; }
.goal-circle.done { background: var(--accent); border-color: var(--accent); }
.goal-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
.goal-text.done { color: var(--text3); text-decoration: line-through; }
.goal-reason { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* SCHEDULE */
.sched-row { display: flex; gap: 12px; align-items: flex-start; padding: 4px 0; }
.sched-time { font-family: var(--font-num); font-size: 13px; color: var(--text3); width: 44px; flex-shrink: 0; padding-top: 3px; letter-spacing: .04em; }
.sched-line { display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
.sched-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.sched-dot.block-dot { background: var(--text3); }
.sched-connector { width: 1px; background: var(--sep); flex: 1; min-height: 20px; margin-top: 3px; }
.sched-content { flex: 1; padding-bottom: 8px; }

/* TASK CARD */
.task-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px; cursor: pointer; transition: background .15s; }
.task-card:active { background: var(--bg2); }
.task-card.done { opacity: .45; }
.task-card.block-card { background: var(--bg2); cursor: default; }
.task-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.task-card-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.task-type-badge { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; font-weight: 500; }
.type-routine { background: #2D3B2E12; color: #2D3B2E; }
.type-unknown { background: #C4603A16; color: #C4603A; }
.type-judgment { background: #4A6FA516; color: #4A6FA5; }
.type-dependent { background: #B5566A16; color: #B5566A; }
.type-block { background: var(--bg3); color: var(--text3); }
.task-title { font-size: 13px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-time { font-family: var(--font-num); font-size: 13px; color: var(--text3); letter-spacing: .04em; flex-shrink: 0; }
.task-card-bottom { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
.task-min { font-size: 11px; color: var(--text3); }
.task-deadline { font-size: 11px; color: var(--accent); }
/* 秘書の判断理由 */
.task-reason { font-size: 10px; color: var(--text3); margin-top: 4px; padding-top: 4px; border-top: 0.5px solid var(--sep); display: flex; align-items: center; gap: 4px; }
.task-reason::before { content: '🐯'; font-size: 9px; }

/* SUBTASK */
.subtask-list { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--sep); display: flex; flex-direction: column; gap: 4px; }
.subtask-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
.subtask-check { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--bg3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.subtask-check.done { background: var(--accent); border-color: var(--accent); }
.subtask-title { font-size: 12px; color: var(--text2); flex: 1; }
.subtask-title.done { color: var(--text3); text-decoration: line-through; }
.subtask-min { font-size: 11px; color: var(--text3); font-family: var(--font-num); }

/* CONFLICT BANNER */
.conflict-banner { background: #FFF3E0; border: 0.5px solid #FFCC80; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; }
.conflict-banner-text { font-size: 13px; color: #E65100; line-height: 1.5; }
.conflict-banner-actions { display: flex; gap: 6px; margin-top: 6px; }
.btn-conflict { font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-family: var(--font); border: 0.5px solid; }
.btn-conflict-move { background: #E65100; color: white; border-color: #E65100; }
.btn-conflict-keep { background: var(--white); color: #E65100; border-color: #FFCC80; }

/* ADD PAGE - クイック入力 */
.quick-wrap { display: flex; flex-direction: column; gap: 12px; }
.quick-input-row { display: flex; gap: 8px; }
.quick-input { flex: 1; height: 48px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); padding: 0 14px; font-size: 15px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.quick-input:focus { border-color: var(--accent); }
.btn-ai { height: 48px; padding: 0 18px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; white-space: nowrap; transition: opacity .2s; display: flex; align-items: center; gap: 6px; }
.btn-ai:active { opacity: .8; }

/* AI RESULT + PILL UI */
.ai-result { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 16px; }
.ai-result-title { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
.ai-task-name { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.ai-reason-row { font-size: 12px; color: var(--text2); margin-bottom: 14px; padding: 8px 12px; background: var(--bg2); border-radius: 6px; line-height: 1.5; }
.ai-reason-row::before { content: '🐯 '; }
/* ピル群 */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 100px; border: 0.5px solid var(--sep); background: var(--bg2); font-size: 12px; font-weight: 500; color: var(--text); cursor: pointer; transition: all .15s; user-select: none; }
.pill:hover { border-color: var(--accent); background: var(--accent-light); }
.pill svg { width: 10px; height: 10px; opacity: .4; }
/* サブタスクプレビュー */
.ai-subtasks { margin-bottom: 14px; }
.ai-subtask-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--sep); font-size: 12px; color: var(--text2); }
.ai-subtask-item:last-child { border-bottom: none; }
.ai-actions { display: flex; gap: 8px; }
.btn-ok { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-ok:active { opacity: .8; }
.ai-loading { display: flex; align-items: center; gap: 10px; padding: 16px; color: var(--text3); font-size: 13px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--bg3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* PILL POPOVER */
.pill-popover { position: absolute; background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 6px; box-shadow: 0 4px 20px rgba(0,0,0,.1); z-index: 150; min-width: 140px; }
.pill-option { padding: 8px 12px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; transition: background .12s; }
.pill-option:hover { background: var(--bg2); }
.pill-option.active { color: var(--accent); font-weight: 500; }
.pill-number-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.pill-number-input { width: 70px; height: 36px; border: 0.5px solid var(--bg3); border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: var(--font-num); color: var(--text); background: var(--bg); outline: none; text-align: center; }
.pill-number-input:focus { border-color: var(--accent); }
.btn-pill-apply { height: 36px; padding: 0 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 13px; font-family: var(--font); cursor: pointer; }

/* 時刻ピル専用 */
.time-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 8px; }
.time-option { padding: 7px 4px; text-align: center; border-radius: 6px; font-family: var(--font-num); font-size: 13px; color: var(--text); cursor: pointer; transition: background .12s; }
.time-option:hover { background: var(--bg2); }
.time-option.active { background: var(--accent-light); color: var(--accent); }
.time-option.taken { opacity: .35; pointer-events: none; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(45,59,46,.18); display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 0 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.32,1,.23,1); max-height: 92vh; overflow-y: auto; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 12px auto 20px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 20px; }

/* DETAIL MODAL */
.detail-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn-done { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-carry { flex: 1; height: 44px; background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); color: var(--text2); cursor: pointer; }
.btn-delete { height: 44px; padding: 0 14px; background: none; border: 0.5px solid #C4603A35; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); color: var(--accent); cursor: pointer; }

/* CHIPS */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-family: var(--font); border: 0.5px solid var(--sep); background: var(--white); color: var(--text2); cursor: pointer; transition: all .15s; }
.chip.selected { background: var(--accent); color: white; border-color: var(--accent); }

/* REVIEW */
.review-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 13px; margin-bottom: 8px; }
.review-card-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
.review-card-sub { font-size: 12px; color: var(--text3); }
.review-action { display: flex; gap: 6px; margin-top: 10px; }
.btn-sm { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-family: var(--font); cursor: pointer; border: 0.5px solid var(--sep); background: var(--bg2); color: var(--text2); }
.btn-sm-accent { background: var(--accent); color: white; border-color: var(--accent); }

/* TOMORROW PAGE */
.tomorrow-load-bar { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; }
.tomorrow-load-label { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
.tomorrow-load-nums { font-family: var(--font-num); font-size: 14px; color: var(--text2); }
.tomorrow-load-nums span { color: var(--accent); }

/* BLOCK MODAL */
.wiz-input-wrap { margin-bottom: 14px; }
.wiz-label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.wiz-input { width: 100%; height: 44px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.wiz-input:focus { border-color: var(--accent); }
.wiz-row { display: flex; gap: 10px; }
.wiz-row .wiz-input-wrap { flex: 1; }
.btn-next { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }

/* EMPTY / TOAST */
.empty { text-align: center; padding: 36px 20px; color: var(--text3); font-size: 13px; line-height: 1.8; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--green); color: white; font-size: 13px; padding: 10px 20px; border-radius: 100px; z-index: 300; opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* RIGHT PANEL */
.right-panel-sec { margin-bottom: 20px; }
.right-panel-title { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">TORA TODO</div>
  <div class="auth-sub">仕事を、システムで回す</div>
  <div class="auth-card">
    <div class="auth-title" id="auth-mode-title">ログイン</div>
    <div class="field"><label>メールアドレス</label><input type="email" id="auth-email" placeholder="example@email.com"></div>
    <div class="field"><label>パスワード</label><input type="password" id="auth-password" placeholder="••••••••"></div>
    <button class="btn-primary" id="auth-btn">ログイン</button>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-toggle"><span id="auth-toggle-text">アカウントがない方は</span> <a id="auth-toggle-link">新規登録</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-logo">TORA TODO</div>
    <div class="header-right">
      <div class="pc-nav" id="pc-nav">
        <button class="pc-nav-item active" data-page="today">
          <svg viewBox="0 0 22 22" fill="none"><rect x="3" y="11" width="4" height="8" rx="1.5" fill="currentColor"/><rect x="9" y="7" width="4" height="12" rx="1.5" fill="currentColor" opacity=".55"/><rect x="15" y="3" width="4" height="16" rx="1.5" fill="currentColor" opacity=".3"/></svg>
          今日

// ============================================================

// タイプ別配置枠
// routine/dependent → 日中(9:00-16:00)
// unknown/judgment → 午前優先(9:00-12:00)、なければ日中

const TYPE_BUFFER = { routine: 0, unknown: 15, judgment: 10, dependent: 5 };

function typeLabel(type) {

}

// ============================================================
// 優先度スコアリング（虎の巻準拠）
// ============================================================
function calcPriorityScore(task) {
  let score = 0;
  // 期限スコア: 期限近いほど高い
  if (task.deadline) {
    const daysLeft = Math.ceil((new Date(task.deadline) - TODAY) / (1000*60*60*24));
    if (daysLeft <= 0) score += 100;
    else if (daysLeft === 1) score += 80;
    else if (daysLeft <= 3) score += 50;
    else if (daysLeft <= 7) score += 20;
  }
  // タイプスコア: 判断・初めては脳リソース高いうちに
  const typeScore = { judgment: 30, unknown: 25, dependent: 20, routine: 10 };
  score += typeScore[task.type] || 10;
  // 所要時間スコア: 短いタスクは詰め込みやすい
  if ((task.estimated_minutes || 30) <= 15) score += 10;
  return score;
}

// 秘書の判断理由を生成
function buildReason(task) {
  const parts = [];
  if (task.deadline) {
    const daysLeft = Math.ceil((new Date(task.deadline) - TODAY) / (1000*60*60*24));
    if (daysLeft <= 0) parts.push('期限超過');
    else if (daysLeft === 1) parts.push('期限明日');
    else if (daysLeft <= 3) parts.push(`期限${daysLeft}日`);
  }
  if (task.type === 'judgment' || task.type === 'unknown') parts.push('午前の脳リソースで対応');
  if (task.type === 'dependent') parts.push('早めにボールを渡す');
  if (task.type === 'routine') parts.push('テンプレで流す');
  if (task.scheduled_time) {
    const h = parseInt(task.scheduled_time.split(':')[0]);
    if (h >= 16) parts.push('集中枠に配置');
    else if (h < 12) parts.push('午前枠に配置');
  }
  return parts.join(' · ') || '標準スケジュール';
}

// ============================================================
// 空き枠計算（虎の巻: 上限340分）
// ============================================================
function getAvailableSlots(date) {
  const WORK_START = 9 * 60, WORK_END = 18 * 60;
  const blockedRanges = allBlocks.filter(b => b.date === date).map(b => {
    const [sh,sm] = b.start_time.split(':').map(Number);
    const [eh,em] = b.end_time.split(':').map(Number);
    return { start: sh*60+sm, end: eh*60+em };
  });
  const scheduled = allTasks.filter(t => t.scheduled_date === date && t.scheduled_time && t.status !== 'done').map(t => {
    const [h,m] = t.scheduled_time.split(':').map(Number);
    const mins = t.estimated_minutes || 30;
    return { start: h*60+m, end: h*60+m+mins };
  });
  const busy = [...blockedRanges, ...scheduled].sort((a,b) => a.start - b.start);
  const slots = [];
  let cursor = WORK_START;
  for (const b of busy) {
    if (cursor < b.start) slots.push({ start: cursor, end: b.start });
    cursor = Math.max(cursor, b.end);
  }
  if (cursor < WORK_END) slots.push({ start: cursor, end: WORK_END });
  return slots;
}

function autoPlotTime(type, estimatedMin, date) {
  const slots = getAvailableSlots(date);
  const needed = estimatedMin + (TYPE_BUFFER[type] || 0);
  // 判断・初めて → 午前優先(9:00-12:00)
  const NOON = 12 * 60;
  const CONC = 16 * 60; // 集中枠開始
  let candidates;
  if (type === 'judgment' || type === 'unknown') {
    // 午前 → 集中枠 → 日中の順
    candidates = [
      ...slots.filter(s => s.start < NOON),
      ...slots.filter(s => s.start >= CONC),
      ...slots.filter(s => s.start >= NOON && s.start < CONC)
    ];
  } else if (type === 'routine' || type === 'dependent') {
    // 日中優先(午前〜16時)
    candidates = [
      ...slots.filter(s => s.start >= 9*60 && s.start < CONC),
      ...slots.filter(s => s.start >= CONC)
    ];
  } else {
    candidates = slots;
  }
  for (const slot of candidates) {
    if (slot.end - slot.start >= needed) {
      const h = Math.floor(slot.start / 60);
      const m = slot.start % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }
  }
  // フォールバック: 最初の空き枠
  if (slots.length) {
    const h = Math.floor(slots[0].start / 60);
    const m = slots[0].start % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  return '09:00';
}

// 今日の総使用時間を計算
function calcUsedMinutes(date) {
  const taskMin = allTasks.filter(t => t.scheduled_date === date && t.status !== 'done').reduce((a,t) => a+(t.estimated_minutes||0),0);
  const blockMin = allBlocks.filter(b => b.date === date).reduce((a,b) => {
    const [sh,sm] = b.start_time.split(':').map(Number);
    const [eh,em] = b.end_time.split(':').map(Number);
    return a + (eh*60+em - sh*60-sm);
  }, 0);
  return taskMin + blockMin;
}

async function loadAll() {
  const [{ data: tasks }, { data: subtasks }, { data: blocks }] = await Promise.all([
    db.from('tasks').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }),
    db.from('subtasks').select('*').order('sort_order'),
    db.from('blocks').select('*').eq('user_id', currentUser.id).order('start_time')
  ]);
  // scheduled_dateを正規化
  allTasks = (tasks || []).map(t => ({ ...t, scheduled_date: normalizeDate(t.scheduled_date) }));
  allSubtasks = subtasks || [];
  allBlocks = blocks || [];
  renderToday();
  renderRightPanel();
}

function navigateTo(page) {
  document.querySelectorAll('.nav-item, .pc-nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll(`[data-page="${page}"]`).forEach(n => n.classList.add('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'add') initAddPage();
  if (page === 'list') renderTaskList();
  if (page === 'tomorrow') renderTomorrow();
  if (page === 'today') renderToday();
}
document.querySelectorAll('.nav-item, .pc-nav-item').forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.page));
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch(e.key.toLowerCase()) {
    case 'n': navigateTo('add'); setTimeout(()=>document.getElementById('quick-title')?.focus(),100); break;
    case 'd': navigateTo('today'); break;
    case 'l': navigateTo('list'); break;
    case 'm': navigateTo('tomorrow'); break;
    case 'escape': ['detail-modal','review-modal','block-modal'].forEach(id=>closeModal(id)); hidePillPopover(); break;
  }
});

function renderNextAction() {
  const wrap = document.getElementById('next-action-wrap');
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const todayPending = allTasks
    .filter(t => t.scheduled_date === TODAY_STR && t.status === 'pending')
    .sort((a,b) => {
      const ta = a.scheduled_time ? parseInt(a.scheduled_time.split(':')[0])*60+parseInt(a.scheduled_time.split(':')[1]) : 9999;
      const tb = b.scheduled_time ? parseInt(b.scheduled_time.split(':')[0])*60+parseInt(b.scheduled_time.split(':')[1]) : 9999;
      return ta - tb;
    });
  const next = todayPending.find(t => {
    if (!t.scheduled_time) return true;
    const [h,m] = t.scheduled_time.split(':').map(Number);
    return h*60+m >= nowMin;
  }) || todayPending[0];
  if (!next) { wrap.innerHTML = ''; return; }
  const subs = allSubtasks.filter(s => s.task_id === next.id);
  const nextSub = subs.find(s => s.status === 'pending');
  const reason = buildReason(next);
  wrap.innerHTML = `
    <div class="next-action" id="next-action-card" data-id="${next.id}">
      <div class="next-action-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polyline points="4,9 8,13 14,5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="next-action-label">NEXT ACTION</div>
        <div class="next-action-title">${nextSub ? nextSub.title : next.title}</div>
        <div class="next-action-meta">${next.title}${next.scheduled_time ? ' · '+next.scheduled_time.slice(0,5) : ''} · ${next.estimated_minutes}min</div>
      </div>
    </div>
  `;
  document.getElementById('next-action-card').addEventListener('click', () => openDetail(next.id));
}

function renderBuffer() {
  const wrap = document.getElementById('buffer-wrap');
  const used = calcUsedMinutes(TODAY_STR);
  const pct = Math.min(100, Math.round(used / 480 * 100));
  const bufferPct = Math.round((480 - used) / 480 * 100);

      <div class="buffer-top">

    </div>
  `;
}

function renderSchedule() {
  const wrap = document.getElementById('schedule-list');
  const todayTasks = allTasks
    .filter(t => t.scheduled_date === TODAY_STR && t.status !== 'done')
    .map(t => ({ ...t, score: calcPriorityScore(t) }))
    .sort((a,b) => {
      const ta = a.scheduled_time ? parseInt(a.scheduled_time.split(':')[0])*60+parseInt(a.scheduled_time.split(':')[1]) : 9999;
      const tb = b.scheduled_time ? parseInt(b.scheduled_time.split(':')[0])*60+parseInt(b.scheduled_time.split(':')[1]) : 9999;
      return ta - tb;
    });
  const todayBlocks = allBlocks.filter(b => b.date === TODAY_STR).sort((a,b) => a.start_time.localeCompare(b.start_time));
  const items = [
    ...todayBlocks.map(b => ({ type:'block', time: b.start_time, data: b })),

    wrap.innerHTML = '<div class="empty">今日のスケジュールはまだありません<br>追加タブからタスクを入れてみましょう</div>';

        <div class="sched-content">

            </div>
          </div>
        </div>
      `;
    } else {

      const reason = buildReason(t);
      row.innerHTML = `
        <div class="sched-time">${timeStr}</div>
        <div class="sched-line"><div class="sched-dot"></div>${!isLast?'<div class="sched-connector"></div>':''}</div>
        <div class="sched-content">
          <div class="task-card" data-id="${t.id}">
            <div class="task-card-top">
              <div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div>
              <span class="task-time">${t.estimated_minutes}min</span>
            </div>

function checkConflicts() {
  const area = document.getElementById('conflict-area');
  if (!area) return;
  const conflicts = [];
  allTasks.filter(t => t.scheduled_date === TODAY_STR && t.scheduled_time && t.status === 'pending').forEach(task => {
    const [th,tm] = task.scheduled_time.split(':').map(Number);
    const taskStart = th*60+tm, taskEnd = taskStart+(task.estimated_minutes||30);
    allBlocks.filter(b => b.date === TODAY_STR).forEach(block => {
      const [bsh,bsm] = block.start_time.split(':').map(Number);
      const [beh,bem] = block.end_time.split(':').map(Number);
      if (taskStart < beh*60+bem && taskEnd > bsh*60+bsm) conflicts.push({ task, block });
    });
  });
  if (!conflicts.length) { area.innerHTML = ''; return; }
  area.innerHTML = conflicts.map(({ task, block }) => `
    <div class="conflict-banner">
      <div class="conflict-banner-text">「${task.title}」が「${block.title}」(${block.start_time.slice(0,5)}〜${block.end_time.slice(0,5)})と重なっています</div>
      <div class="conflict-banner-actions">
        <button class="btn-conflict btn-conflict-move" onclick="moveConflictTask('${task.id}')">空き枠に移動</button>
        <button class="btn-conflict btn-conflict-keep" onclick="dismissConflict(this)">このままにする</button>
      </div>
    </div>
  `).join('');
}
window.moveConflictTask = async function(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const newTime = autoPlotTime(task.type, task.estimated_minutes, TODAY_STR);
  await db.from('tasks').update({ scheduled_time: newTime }).eq('id', taskId);
  task.scheduled_time = newTime;
  renderToday();
  showToast(`${task.title}を${newTime}に移動しました`);
};
window.dismissConflict = function(btn) { btn.closest('.conflict-banner').remove(); };

// GEMINI AI（虎の巻ルールをプロンプトに組み込む）
// ============================================================
async function analyzeWithGemini(title) {
  const prompt = `あなたは「仕事の虎の巻」に従うタスク分析AIです。

【虎の巻のルール】
- タスク種類: routine(毎回同じ手順), unknown(初めて・新規), judgment(意思決定が主), dependent(他者のアクションが必要)
- 所要時間デフォルト: メール返信5分, ルーティン30分, 資料作成45〜60分, 判断系25分, 初めて30分, 迷ったら30分
- 分解の判断: 「やり始める前に何か揃えるものがあるか？」→ある場合のみサブタスクに分解

タスク名：「${title}」

以下のJSON形式のみを返してください（説明不要・コードブロック不要）:
{
  "type": "routine" | "unknown" | "judgment" | "dependent",
  "estimated_minutes": 数値,
  "subtasks": [{"title": "サブタスク名", "minutes": 数値}],
  "reason": "虎の巻のどのルールに従って判断したか一文で"
}

subtasksは分解が必要な場合のみ設定（routineは原則空配列）。`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

let addState = { type: null, patternKey: null, count: 1, subtasks: [], totalMin: 0, scheduledTime: null };

function initAddPage() {
  addState = { type: null, patternKey: null, count: 1, subtasks: [], totalMin: 0, scheduledTime: null };
  const nameEl = document.getElementById('task-name-input');
  const deadlineEl = document.getElementById('deadline-input');
  if(nameEl) nameEl.value = '';
  if(deadlineEl) deadlineEl.value = '';
  document.querySelectorAll('.type-opt').forEach(o => { o.style.borderColor='var(--sep)'; o.style.background='var(--white)'; });
  ['step-pattern','step-count','step-preview','step-plot'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });

  document.querySelectorAll('.type-opt').forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll('.type-opt').forEach(o => { o.style.borderColor='var(--sep)'; o.style.background='var(--white)'; });
      opt.style.borderColor='var(--accent)'; opt.style.background='var(--accent-light)';
      addState.type=opt.dataset.type; addState.patternKey=null; addState.count=1;
      const cv=document.getElementById('count-val'); if(cv) cv.textContent='1';
      renderPatternList();
      document.getElementById('step-pattern').style.display='block';
      ['step-count','step-preview','step-plot'].forEach(id=>document.getElementById(id).style.display='none');
    };
  });

  const cm=document.getElementById('count-minus');
  const cp=document.getElementById('count-plus');
  if(cm) cm.onclick=()=>{ if(addState.count<=1) return; addState.count--; document.getElementById('count-val').textContent=addState.count; updateSubtasksAndPlot(); };
  if(cp) cp.onclick=()=>{ addState.count++; document.getElementById('count-val').textContent=addState.count; updateSubtasksAndPlot(); };

  if(deadlineEl) deadlineEl.onchange=()=>{ if(addState.patternKey){ addState.scheduledTime=autoPlotTime(addState.type,addState.totalMin,TODAY_STR); updatePlotInfo(); } };
  const dcb=document.getElementById('deadline-clear-btn');
  if(dcb) dcb.onclick=()=>{ if(deadlineEl) deadlineEl.value=''; if(addState.patternKey) updatePlotInfo(); };

  const pb=document.getElementById('plot-btn');
  if(pb) pb.onclick=async()=>{
    const title=document.getElementById('task-name-input').value.trim();
    if(!title){ showToast('タスク名を入力してください'); return; }
    if(!addState.type){ showToast('タイプを選択してください'); return; }
    if(!addState.patternKey){ showToast('作業パターンを選択してください'); return; }
    const deadline=deadlineEl?deadlineEl.value||null:null;
    const used=calcUsedMinutes(TODAY_STR);
    if(used+addState.totalMin>BUFFER_LIMIT){
      const over=used+addState.totalMin-BUFFER_LIMIT;
      if(!confirm(`今日の使用時間が上限(${BUFFER_LIMIT}分)を${over}分超えます。\n虎の巻では20%のバッファを推奨しています。\nそれでも追加しますか？`)) return;
    }
    await saveTask({title,type:addState.type,estimated_minutes:addState.totalMin,deadline,scheduled_date:TODAY_STR,scheduled_time:addState.scheduledTime,subtasks:addState.subtasks});
  };
}

function renderPatternList() {
  const list=document.getElementById('pattern-list'); if(!list) return;
  const entries=Object.entries(PATTERNS).filter(([,p])=>p.types.includes(addState.type));
  const all=entries.length?entries:Object.entries(PATTERNS);
  list.innerHTML=all.map(([key,p])=>`<div onclick="selectPattern('${key}')" data-pattern="${key}" style="background:var(--white);border:0.5px solid var(--sep);border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;"><span style="font-size:13px;font-weight:500;color:var(--text);">${p.name}</span><span style="font-family:var(--font-num);font-size:13px;color:var(--text3);">${p.baseMin}min〜</span></div>`).join('');
}

window.selectPattern=function(key){
  document.querySelectorAll('#pattern-list > div').forEach(o=>{o.style.borderColor='var(--sep)';o.style.background='var(--white)';});
  const sel=document.querySelector(`#pattern-list [data-pattern="${key}"]`);
  if(sel){sel.style.borderColor='var(--accent)';sel.style.background='var(--accent-light)';}
  addState.patternKey=key; addState.count=1;
  const cv=document.getElementById('count-val'); if(cv) cv.textContent='1';
  const pattern=PATTERNS[key];
  if(pattern.countable) document.getElementById('step-count').style.display='block';
  else { document.getElementById('step-count').style.display='none'; addState.count=1; }
  updateSubtasksAndPlot();
};

function updateSubtasksAndPlot(){
  const pattern=PATTERNS[addState.patternKey]; if(!pattern) return;
  if(addState.count===1){ addState.subtasks=pattern.subtasks.map(s=>({...s})); }
  else { addState.subtasks=[]; for(let i=1;i<=addState.count;i++) pattern.subtasks.forEach(s=>addState.subtasks.push({title:`[${i}件目] ${s.title}`,minutes:s.minutes})); }
  addState.totalMin=addState.subtasks.reduce((a,s)=>a+s.minutes,0);
  const preview=document.getElementById('subtask-preview');
  if(preview) preview.innerHTML=addState.subtasks.map(s=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--sep);font-size:13px;"><span style="color:var(--text2);">${s.title}</span><span style="font-family:var(--font-num);font-size:12px;color:var(--text3);">${s.minutes}min</span></div>`).join('')+`<div style="text-align:right;font-family:var(--font-num);font-size:14px;color:var(--accent);margin-top:8px;">合計 ${addState.totalMin}min</div>`;
  document.getElementById('step-preview').style.display='block';
  addState.scheduledTime=autoPlotTime(addState.type,addState.totalMin,TODAY_STR);
  updatePlotInfo();
  document.getElementById('step-plot').style.display='block';
}

function updatePlotInfo(){
  const info=document.getElementById('plot-info'); if(!info) return;
  const parts=[]; const deadlineEl=document.getElementById('deadline-input');
  const deadline=deadlineEl?deadlineEl.value:'';
  if(deadline){const d=Math.ceil((new Date(deadline)-TODAY)/(1000*60*60*24));if(d<=0)parts.push('期限超過');else if(d===1)parts.push('期限明日');else if(d<=3)parts.push(`期限${d}日`);}
  if(addState.type==='judgment'||addState.type==='unknown') parts.push('午前の脳リソースで対応');
  if(addState.type==='dependent') parts.push('早めにボールを渡す');
  if(addState.type==='routine') parts.push('テンプレで流す');
  if(addState.scheduledTime){const h=parseInt(addState.scheduledTime.split(':')[0]);if(h>=16)parts.push('集中枠');else if(h<12)parts.push('午前枠');}
  const reason=parts.join(' · ')||'標準スケジュール';
  info.innerHTML=`<div style="font-size:12px;color:var(--text3);margin-bottom:4px;">プロット時刻</div><div style="font-family:var(--font-num);font-size:18px;color:var(--text);margin-bottom:4px;">${addState.scheduledTime} · ${addState.totalMin}min</div><div style="font-size:11px;color:var(--text3);">🐯 ${reason}</div>`;
}

async function saveTask(data) {
  const usedMin = calcUsedMinutes(TODAY_STR);
  if (data.scheduled_date === TODAY_STR && usedMin + (data.estimated_minutes||30) > BUFFER_LIMIT) {
    const over = usedMin + (data.estimated_minutes||30) - BUFFER_LIMIT;
    if (!confirm(`今日の使用時間が上限(${BUFFER_LIMIT}分)を${over}分超えます。\n虎の巻では1日の20〜30%をバッファとして空けることを推奨しています。\n\nそれでも今日に追加しますか？`)) return;
  }
  const { data: task, error } = await db.from('tasks').insert({
    user_id: currentUser.id,
    title: data.title,
    type: data.type || 'judgment',
    status: 'pending',
    estimated_minutes: data.estimated_minutes || 30,
    deadline: data.deadline || null,
    scheduled_date: data.scheduled_date || null,
    scheduled_time: data.scheduled_time || null,
    memo: data.memo || null
  }).select().single();
  if (error) { showToast('保存に失敗しました'); console.error(error); return; }

  // scheduled_dateを正規化してから追加
  task.scheduled_date = normalizeDate(task.scheduled_date);
  allTasks.unshift(task);

  if (data.subtasks?.length) {
    const subs = data.subtasks.map((s,i) => ({
      task_id: task.id,
      title: s.title,
      estimated_minutes: s.minutes || s.estimated_minutes || 30,
      status: 'pending',
      sort_order: i
    }));
    const { data: saved } = await db.from('subtasks').insert(subs).select();
    if (saved) allSubtasks.push(...saved);
  }

  showToast('タスクを追加しました 🐯');
  aiResult = null;
  // 今日ページに戻ってスケジュール表示を確認
  navigateTo('today');
}

// ============================================================
// TOGGLE
// ============================================================
async function toggleTask(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const ns = task.status === 'done' ? 'pending' : 'done';
  await db.from('tasks').update({ status: ns }).eq('id', taskId);
  task.status = ns;
  renderToday();
  if (ns === 'done') showToast('完了！🐯');
}
async function toggleSubtask(subId) {
  const sub = allSubtasks.find(s => s.id === subId);
  if (!sub) return;
  const ns = sub.status === 'done' ? 'pending' : 'done';
  await db.from('subtasks').update({ status: ns }).eq('id', subId);
  sub.status = ns;
  renderToday();
}

// ============================================================
// DETAIL MODAL
// ============================================================
function openDetail(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const subs = allSubtasks.filter(s => s.task_id === taskId);
  const reason = buildReason(task);
  const body = document.getElementById('detail-body');
  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <div class="task-type-badge type-${task.type}">${typeLabel(task.type)}</div>
      <span style="font-size:16px;font-weight:500;">${task.title}</span>
    </div>
    <div style="display:flex;gap:16px;margin-bottom:12px;">
      <div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">所要時間</div><div style="font-family:var(--font-num);font-size:22px;color:var(--accent);">${task.estimated_minutes}<span style="font-size:11px;">min</span></div></div>
      ${task.scheduled_time ? `<div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">開始時刻</div><div style="font-family:var(--font-num);font-size:22px;color:var(--text2);">${task.scheduled_time.slice(0,5)}</div></div>` : ''}
      ${task.deadline ? `<div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">期限</div><div style="font-size:13px;color:var(--accent);margin-top:6px;">${task.deadline}</div></div>` : ''}
    </div>
    <div style="font-size:11px;color:var(--text3);background:var(--bg2);border-radius:6px;padding:8px 10px;margin-bottom:14px;">🐯 ${reason}</div>
    ${subs.length ? `<div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">サブタスク</div><div class="subtask-list" style="margin-top:0;padding-top:0;border-top:none;">${subs.map(s=>`<div class="subtask-item"><div class="subtask-check ${s.status==='done'?'done':''}" data-sub-id="${s.id}">${s.status==='done'?`<svg width="7" height="7" viewBox="0 0 7 7"><polyline points="1,3.5 2.8,5.5 6,1.5" stroke="white" stroke-width="1.5" fill="none"/></svg>`:''}</div><span class="subtask-title ${s.status==='done'?'done':''}">${s.title}</span><span class="subtask-min">${s.estimated_minutes}min</span></div>`).join('')}</div>` : ''}
    ${task.memo ? `<div style="margin-top:12px;font-size:13px;color:var(--text2);line-height:1.6;background:var(--bg2);border-radius:8px;padding:10px 12px;">${task.memo}</div>` : ''}
    <div class="detail-actions">
      <button class="btn-done" id="dd-btn">完了</button>
      <button class="btn-carry" id="dc-btn">明日に持ち越し</button>
      <button class="btn-delete" id="ddel-btn">削除</button>
    </div>
  `;
  body.querySelectorAll('.subtask-check').forEach(el => el.addEventListener('click', () => toggleSubtask(el.dataset.subId)));
  document.getElementById('dd-btn').addEventListener('click', async () => { await toggleTask(taskId); closeModal('detail-modal'); });
  document.getElementById('dc-btn').addEventListener('click', async () => {
    const autoTime = autoPlotTime(task.type, task.estimated_minutes, TOMORROW_STR);
    await db.from('tasks').update({ status: 'carried', scheduled_date: TOMORROW_STR, scheduled_time: autoTime }).eq('id', taskId);
    const t = allTasks.find(x => x.id === taskId);
    if (t) { t.status = 'carried'; t.scheduled_date = TOMORROW_STR; t.scheduled_time = autoTime; }
    closeModal('detail-modal'); renderToday(); showToast('明日に持ち越しました');
  });
  document.getElementById('ddel-btn').addEventListener('click', async () => {
    if (!confirm('削除しますか？')) return;
    await db.from('tasks').delete().eq('id', taskId);
    allTasks = allTasks.filter(t => t.id !== taskId);
    allSubtasks = allSubtasks.filter(s => s.task_id !== taskId);
    closeModal('detail-modal'); renderToday(); showToast('削除しました');
  });
  openModal('detail-modal');
}

// ============================================================
// TASK LIST
// ============================================================
function renderTaskList() {
  const list = document.getElementById('task-list');
  let tasks = [...allTasks];
  if (currentFilter === 'pending') tasks = tasks.filter(t => t.status === 'pending');
  else if (['routine','unknown','judgment','dependent'].includes(currentFilter)) tasks = tasks.filter(t => t.type === currentFilter);
  if (!tasks.length) { list.innerHTML = '<div class="empty">タスクがありません</div>'; return; }
  list.innerHTML = '';
  tasks.forEach(t => {
    const subs = allSubtasks.filter(s => s.task_id === t.id);
    const card = document.createElement('div');
    card.className = `task-card${t.status==='done'?' done':''}`;
    card.innerHTML = `
      <div class="task-card-top">
        <div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div>
        <span class="task-time">${t.estimated_minutes}min</span>
      </div>
      <div class="task-card-bottom">
        ${t.scheduled_date ? `<span class="task-min">${t.scheduled_date}</span>` : ''}
        ${t.deadline ? `<span class="task-deadline">期限 ${t.deadline}</span>` : ''}
        ${subs.length ? `<span class="task-min">サブ ${subs.filter(s=>s.status==='done').length}/${subs.length}</span>` : ''}
      </div>
    `;
    card.addEventListener('click', () => openDetail(t.id));
    list.appendChild(card);
  });
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('selected'));
  c.classList.add('selected');
  currentFilter = c.dataset.filter;
  renderTaskList();
}));

// ============================================================
// TOMORROW PAGE
// ============================================================
function renderTomorrow() {
  // 明日の負荷バー
  const loadWrap = document.getElementById('tomorrow-load-wrap');
  const tmUsed = calcUsedMinutes(TOMORROW_STR);
  const tmPct = Math.min(100, Math.round(tmUsed / BUFFER_LIMIT * 100));
  loadWrap.innerHTML = `
    <div class="tomorrow-load-bar">
      <div class="tomorrow-load-label">
        <span>明日の使用時間</span>
        <span class="tomorrow-load-nums"><span>${tmUsed}</span>/${BUFFER_LIMIT}min</span>
      </div>
      <div class="buffer-track"><div class="buffer-fill ${tmUsed > BUFFER_LIMIT ? 'warn' : ''}" style="width:${tmPct}%"></div></div>
    </div>
  `;

  // 明日のブロック
  const blockList = document.getElementById('block-list');
  const tmBlocks = allBlocks.filter(b => b.date === TOMORROW_STR);
  blockList.innerHTML = tmBlocks.length
    ? tmBlocks.map(b => `<div class="task-card block-card" style="margin-bottom:6px;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-block">固定</div><span class="task-title">${b.title}</span></div><span class="task-time">${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span></div></div>`).join('')
    : '<div style="font-size:13px;color:var(--text3);padding:8px 0 12px;">明日の固定ブロックなし</div>';

  // 明日のタスク
  const tmTasks = allTasks.filter(t => t.scheduled_date === TOMORROW_STR && t.status !== 'done')
    .sort((a,b) => (a.scheduled_time||'99:99').localeCompare(b.scheduled_time||'99:99'));
  const tmList = document.getElementById('tomorrow-task-list');
  tmList.innerHTML = tmTasks.length
    ? tmTasks.map(t => `<div class="task-card" style="margin-bottom:6px;" onclick="openDetail('${t.id}')"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.scheduled_time ? t.scheduled_time.slice(0,5) : '--:--'} · ${t.estimated_minutes}min</span></div><div class="task-reason">${buildReason(t)}</div></div>`).join('')
    : '<div style="font-size:13px;color:var(--text3);padding:8px 0;">明日のタスクなし</div>';

  // 未スケジュール
  const unscheduled = allTasks.filter(t => !t.scheduled_date && t.status === 'pending');
  const unList = document.getElementById('unscheduled-list');
  unList.innerHTML = unscheduled.length
    ? unscheduled.map(t => `<div class="task-card" style="margin-bottom:6px;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.estimated_minutes}min</span></div></div>`).join('')
    : '<div style="font-size:13px;color:var(--text3);padding:8px 0;">なし</div>';

  document.getElementById('plot-tomorrow-btn').onclick = async () => {
    const targets = [...allTasks.filter(t => t.status === 'carried'), ...unscheduled];
    if (!targets.length) { showToast('プロット対象なし'); return; }
    await Promise.all(targets.map(async t => {
      const autoTime = autoPlotTime(t.type, t.estimated_minutes, TOMORROW_STR);
      await db.from('tasks').update({ scheduled_date: TOMORROW_STR, scheduled_time: autoTime, status: 'pending' }).eq('id', t.id);
      t.scheduled_date = TOMORROW_STR; t.scheduled_time = autoTime; t.status = 'pending';
    }));
    showToast(`${targets.length}件を明日に自動プロットしました`);
    renderTomorrow();
  };
}

// ============================================================
// BLOCKS
// ============================================================
document.getElementById('add-block-btn').addEventListener('click', () => openModal('block-modal'));
document.getElementById('add-block-right-btn')?.addEventListener('click', () => {
  document.getElementById('block-date').value = TODAY_STR;
  openModal('block-modal');
});
document.getElementById('block-save-btn').addEventListener('click', async () => {
  const title = document.getElementById('block-title').value.trim();
  const start = document.getElementById('block-start').value;
  const end = document.getElementById('block-end').value;
  const date = document.getElementById('block-date').value;
  if (!title || !start || !end) { showToast('内容・時間を入力してください'); return; }
  const { data } = await db.from('blocks').insert({ user_id: currentUser.id, title, start_time: start+':00', end_time: end+':00', date }).select().single();
  if (data) allBlocks.push(data);
  document.getElementById('block-title').value = '';
  closeModal('block-modal');
  renderTomorrow(); renderToday(); renderRightPanel();
  showToast('固定ブロックを追加しました');
});

// ============================================================
// RIGHT PANEL
// ============================================================
function renderRightPanel() {
  const todayBlocks = allBlocks.filter(b => b.date === TODAY_STR);
  const blockRight = document.getElementById('block-list-right');
  if (blockRight) {
    blockRight.innerHTML = todayBlocks.length
      ? todayBlocks.map(b => `<div class="task-card block-card" style="margin-bottom:6px;cursor:default;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-block">固定</div><span class="task-title">${b.title}</span></div><span class="task-time">${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span></div></div>`).join('')
      : '<div style="font-size:12px;color:var(--text3);padding:4px 0;">今日の会議なし</div>';
  }
  // 明日のミニ負荷バー
  const miniLoad = document.getElementById('tomorrow-mini-load');
  if (miniLoad) {
    const tmUsed = calcUsedMinutes(TOMORROW_STR);
    const tmPct = Math.min(100, Math.round(tmUsed / BUFFER_LIMIT * 100));
    miniLoad.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px;">
        <span>${tmUsed}min / ${BUFFER_LIMIT}min</span>
        <span style="color:${tmUsed > BUFFER_LIMIT ? 'var(--accent)' : 'var(--text3)'};">${tmUsed > BUFFER_LIMIT ? '上限超え' : '余裕あり'}</span>
      </div>
      <div class="buffer-track"><div class="buffer-fill ${tmUsed > BUFFER_LIMIT ? 'warn' : ''}" style="width:${tmPct}%"></div></div>
    `;
  }
}

// ============================================================
// WEEKLY REVIEW
// ============================================================
document.getElementById('review-btn').addEventListener('click', () => {
  const pending = allTasks.filter(t => t.status === 'pending' || t.status === 'carried');
  const body = document.getElementById('review-body');
  body.innerHTML = `<div style="font-size:13px;color:var(--text2);margin-bottom:16px;">未完了 <strong>${pending.length}件</strong></div>` +
    (pending.length ? pending.slice(0,15).map(t => `
      <div class="review-card">
        <div class="review-card-title">${t.title}</div>
        <div class="review-card-sub">${typeLabel(t.type)} · ${t.estimated_minutes}min</div>
        <div class="review-action">
          <button class="btn-sm" onclick="reviewMoveNextWeek('${t.id}')">来週に移す</button>
          <button class="btn-sm btn-sm-accent" onclick="reviewKeep()">今週継続</button>
          <button class="btn-sm" style="color:var(--accent);" onclick="reviewDrop('${t.id}')">削除</button>
        </div>
      </div>`).join('')
    : '<div class="empty">未完了タスクなし 🎉</div>');
  openModal('review-modal');
});
window.reviewMoveNextWeek = async (id) => {
  const nm = new Date(TODAY); nm.setDate(TODAY.getDate() + 7);
  const nStr = nm.toISOString().split('T')[0];
  await db.from('tasks').update({ scheduled_date: nStr, status: 'pending' }).eq('id', id);
  const t = allTasks.find(x => x.id === id);
  if (t) { t.scheduled_date = nStr; t.status = 'pending'; }
  showToast('来週に移しました');
  document.getElementById('review-btn').click();
};
window.reviewKeep = () => { showToast('今週継続します'); closeModal('review-modal'); };
window.reviewDrop = async (id) => {
  if (!confirm('削除しますか？')) return;
  await db.from('tasks').delete().eq('id', id);
  allTasks = allTasks.filter(t => t.id !== id);
  showToast('削除しました');
  document.getElementById('review-btn').click();
};

// ============================================================
// MODAL CLOSE
// ============================================================
['detail-modal','review-modal','block-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) { if (e.target === this) closeModal(id); });
});
document.querySelectorAll('.modal').forEach(m => {
  let sy = 0;
  m.addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, { passive: true });
  m.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - sy > 80) { const o = m.closest('.modal-overlay'); if (o) o.classList.remove('open'); } }, { passive: true });
});
</script>
