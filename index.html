<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TORA TODO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #FDFAF7; --bg2: #F2EDE6; --bg3: #EBE5DC;
  --accent: #C4603A; --accent-light: #C4603A14;
  --green: #2D3B2E; --text: #2D3B2E; --text2: #6B7B6C; --text3: #9AA59B;
  --white: #ffffff; --sep: rgba(45,59,46,0.08);
  --radius: 12px; --radius-sm: 8px;
  --font: 'DM Sans', -apple-system, sans-serif;
  --font-num: 'Bebas Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; margin: 0 auto; }
/* AUTH */
#auth-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
.auth-logo { font-family: var(--font-num); font-size: 44px; color: var(--accent); letter-spacing: .05em; margin-bottom: 4px; }
.auth-sub { font-size: 11px; color: var(--text3); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 40px; }
.auth-card { background: var(--white); border-radius: var(--radius); border: 0.5px solid var(--sep); padding: 28px 24px; width: 100%; max-width: 360px; }
.auth-title { font-size: 14px; font-weight: 500; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
.field input { width: 100%; height: 42px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--bg); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; }
.field input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.auth-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text3); }
.auth-toggle a { color: var(--accent); cursor: pointer; }
.auth-err { font-size: 12px; color: var(--accent); margin-top: 10px; text-align: center; min-height: 18px; }
/* APP LAYOUT */
#app { display: none; flex-direction: column; height: 100vh; }
.header { position: sticky; top: 0; z-index: 100; background: rgba(253,250,247,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0.5px solid var(--sep); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.header-logo { font-family: var(--font-num); font-size: 22px; color: var(--accent); letter-spacing: .06em; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header-date { font-size: 11px; color: var(--text3); }
.btn-logout { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font); }
.app-body { display: flex; flex: 1; overflow: hidden; }
.main { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }
/* NAV */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(242,237,230,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 0.5px solid var(--sep); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 14px; border-radius: 8px; }
.nav-icon { width: 22px; height: 22px; }
.nav-label { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); font-weight: 500; }
.nav-item.active .nav-label { color: var(--accent); }
.nav-item.active .nav-icon { color: var(--accent); }
/* PAGES */
.page { display: none; }
.page.active { display: block; }
/* OPTIMIZE BTN */
.optimize-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-family: var(--font); font-weight: 500; transition: all .2s; }
.optimize-btn.idle { background: var(--bg2); color: var(--text3); border: 0.5px solid var(--sep); }
.optimize-btn.needs { background: var(--accent); color: white; }
.optimize-btn.running { background: var(--bg2); color: var(--text3); pointer-events: none; }
/* FINISH BANNER */
.finish-banner { background: var(--green); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
/* TASK CARDS */
.task-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px; cursor: pointer; transition: background .15s; }
.task-card:active { background: var(--bg2); }
.task-card.done { opacity: .45; }
.task-card.block-card { background: var(--bg2); cursor: default; }
.task-card.pinned { border-color: var(--accent); border-width: 1px; }
.task-card.date-pinned { border-color: #4A6FA5; border-width: 1px; }
.task-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.task-card-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.task-type-badge { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; font-weight: 500; }
.type-routine { background: #2D3B2E12; color: #2D3B2E; }
.type-unknown { background: #C4603A16; color: #C4603A; }
.type-judgment { background: #4A6FA516; color: #4A6FA5; }
.type-dependent { background: #B5566A16; color: #B5566A; }
.type-creative { background: #7B5EA716; color: #7B5EA7; }
.type-block { background: var(--bg3); color: var(--text3); }
.task-title { font-size: 13px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-time { font-family: var(--font-num); font-size: 13px; color: var(--text3); letter-spacing: .04em; flex-shrink: 0; }
.task-card-bottom { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
.task-min { font-size: 11px; color: var(--text3); }
.task-deadline { font-size: 11px; color: var(--accent); }
.task-reason { font-size: 10px; color: var(--text3); margin-top: 4px; padding-top: 4px; border-top: 0.5px solid var(--sep); }
.task-reason::before { content: '🐯 '; font-size: 9px; }
/* TOGGLE */
.pin-switch { width: 28px; height: 16px; border-radius: 8px; background: var(--bg3); border: none; cursor: pointer; position: relative; flex-shrink: 0; transition: background .2s; }
.pin-switch.on { background: var(--accent); }
.pin-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: white; transition: transform .2s; }
.pin-switch.on::after { transform: translateX(12px); }
/* SCHEDULE */
.sched-wrap { position: relative; padding-left: 22px; }
.sched-line-bar { position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1.5px; background: var(--sep); border-radius: 1px; pointer-events: none; }
.sched-row { display: flex; gap: 12px; align-items: flex-start; padding: 4px 0; position: relative; }
.sched-dot { position: absolute; left: -18px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; top: 6px; }
.sched-dot.active-dot { background: #E65100; width: 12px; height: 12px; left: -20px; top: 4px; box-shadow: 0 0 0 3px rgba(230,81,0,.18); }
.sched-dot.block-dot { background: var(--text3); }
.sched-dot.done-dot { background: var(--bg3); }
.sched-time { font-family: var(--font-num); font-size: 12px; color: var(--text3); width: 38px; flex-shrink: 0; padding-top: 2px; letter-spacing: .04em; }
.sched-time.now-time { color: #E65100; font-weight: 700; }
.sched-content { flex: 1; padding-bottom: 4px; }
.subtask-list { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--sep); display: flex; flex-direction: column; gap: 4px; }
.subtask-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
.subtask-check { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--bg3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.subtask-check.done { background: var(--accent); border-color: var(--accent); }
.subtask-title { font-size: 12px; color: var(--text2); flex: 1; }
.subtask-title.done { color: var(--text3); text-decoration: line-through; }
.subtask-min { font-size: 11px; color: var(--text3); font-family: var(--font-num); }
/* PLAN PAGE */
.plan-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; -webkit-overflow-scrolling: touch; }
.plan-board::-webkit-scrollbar { height: 4px; }
.plan-board::-webkit-scrollbar-track { background: var(--bg2); border-radius: 2px; }
.plan-board::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
.plan-col { flex: 0 0 240px; background: var(--bg2); border-radius: var(--radius); padding: 12px; min-height: 300px; }
.plan-col-header { margin-bottom: 10px; }
.plan-col-date { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.plan-col-finish { font-size: 11px; color: var(--text3); }
.plan-col-body { min-height: 200px; }
.plan-col.drag-over { background: var(--accent-light); border: 1.5px dashed var(--accent); }
.plan-task-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 6px; cursor: grab; transition: all .15s; }
.plan-task-card:active { cursor: grabbing; opacity: .8; }
.plan-task-card.date-pinned { border-color: #4A6FA5; }
.plan-task-card.dragging { opacity: .4; }
.plan-task-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
/* ADD PAGE */
.add-step { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 16px; }
.add-step-title { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 12px; }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-opt { padding: 12px; border: 0.5px solid var(--sep); border-radius: var(--radius-sm); background: var(--white); cursor: pointer; text-align: left; }
.type-opt-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.type-opt-desc { font-size: 11px; color: var(--text3); line-height: 1.4; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--bg3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn-ok { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; width: 100%; }
.count-row { display: flex; align-items: center; gap: 12px; }
.count-btn { width: 32px; height: 32px; border: 0.5px solid var(--sep); border-radius: 50%; background: var(--white); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-family: var(--font); }
.count-val { font-family: var(--font-num); font-size: 22px; color: var(--accent); min-width: 24px; text-align: center; }
/* CALENDAR */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-nav { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text2); padding: 4px 8px; border-radius: 6px; }
.cal-month { font-size: 13px; font-weight: 500; color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day-label { text-align: center; font-size: 10px; color: var(--text3); padding: 4px 0; }
.cal-day { text-align: center; padding: 6px 2px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
.cal-day:hover { background: var(--bg2); }
.cal-day.today { color: var(--accent); font-weight: 700; }
.cal-day.selected { background: var(--accent); color: white !important; font-weight: 500; }
.cal-day.past { color: var(--text3); opacity: .4; pointer-events: none; }
.cal-day.empty { pointer-events: none; }
/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(45,59,46,.18); display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 0 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.32,1,.23,1); max-height: 92vh; overflow-y: auto; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 12px auto 20px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 20px; }
/* SETUP PAGE */
.setup-section { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.setup-section-title { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 12px; }
.time-opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.time-opt { height: 34px; padding: 0 10px; border: 0.5px solid var(--sep); border-radius: var(--radius-sm); background: var(--white); font-size: 12px; font-family: var(--font); cursor: pointer; color: var(--text); }
.time-opt.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }
/* MISC */
.wiz-input { width: 100%; height: 44px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; }
.wiz-input:focus { border-color: var(--accent); }
.wiz-label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.wiz-input-wrap { margin-bottom: 14px; }
.wiz-row { display: flex; gap: 10px; }
.wiz-row .wiz-input-wrap { flex: 1; }
.btn-next { width: 100%; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-sm { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-family: var(--font); cursor: pointer; border: 0.5px solid var(--sep); background: var(--bg2); color: var(--text2); }
.sec-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 10px; margin-top: 20px; }
.sec-label:first-child { margin-top: 4px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-family: var(--font); border: 0.5px solid var(--sep); background: var(--white); color: var(--text2); cursor: pointer; }
.chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
.empty { text-align: center; padding: 36px 20px; color: var(--text3); font-size: 13px; line-height: 1.8; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--green); color: white; font-size: 13px; padding: 10px 20px; border-radius: 100px; z-index: 300; opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.detail-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn-done { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-delete { height: 44px; padding: 0 14px; background: none; border: 0.5px solid #C4603A35; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">TORA TODO</div>
  <div class="auth-sub">仕事を、システムで回す</div>
  <div class="auth-card">
    <div class="auth-title" id="auth-mode-title">ログイン</div>
    <div class="field"><label>メールアドレス</label><input type="email" id="auth-email" placeholder="example@email.com"></div>
    <div class="field"><label>パスワード</label><input type="password" id="auth-password" placeholder="••••••••"></div>
    <button class="btn-primary" id="auth-btn">ログイン</button>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-toggle"><span id="auth-toggle-text">アカウントがない方は</span> <a id="auth-toggle-link">新規登録</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-logo">TORA TODO</div>
    <div class="header-right">
      <div class="header-date" id="header-date"></div>
      <button class="btn-logout" id="logout-btn">ログアウト</button>
    </div>
  </div>
  <div class="app-body">
    <div class="main" id="main-content">

      <!-- TODAY -->
      <div class="page active" id="page-today">
        <div id="optimize-area"></div>
        <div id="unplaced-banner"></div>
        <div id="finish-banner"></div>
        <div class="sec-label" style="margin-top:8px;">今日のスケジュール</div>
        <div id="schedule-list"></div>
      </div>

      <!-- PLAN -->
      <div class="page" id="page-plan">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:4px;">
          <div style="font-size:13px;font-weight:500;color:var(--text);">タスク計画</div>
        </div>
        <div class="plan-board" id="plan-board"></div>
      </div>

      <!-- ADD -->
      <div class="page" id="page-add">
        <div class="sec-label" style="margin-top:4px;">タスクを追加</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="add-step">
            <div class="add-step-title">タスク名</div>
            <input class="wiz-input" id="task-name-input" placeholder="例：来月キャンペーン企画" maxlength="60">
          </div>
          <div class="add-step">
            <div class="add-step-title">期限（任意）</div>
            <div id="deadline-calendar"></div>
            <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;">
              <span id="deadline-selected" style="font-size:12px;color:var(--text3);">未設定</span>
              <button id="deadline-clear-btn" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:var(--font);">クリア</button>
            </div>
          </div>
          <div class="add-step">
            <div class="add-step-title">タスクのタイプ</div>
            <div class="type-grid">
              <div class="type-opt" data-type="routine"><div class="type-opt-name">ルーティン</div><div class="type-opt-desc">毎回同じ手順</div></div>
              <div class="type-opt" data-type="unknown"><div class="type-opt-name">初めて</div><div class="type-opt-desc">新規・不確実</div></div>
              <div class="type-opt" data-type="judgment"><div class="type-opt-name">判断</div><div class="type-opt-desc">意思決定が主</div></div>
              <div class="type-opt" data-type="dependent"><div class="type-opt-name">他者依存</div><div class="type-opt-desc">相手のアクション待ち</div></div>
              <div class="type-opt" data-type="creative" style="grid-column:span 2;"><div class="type-opt-name">制作</div><div class="type-opt-desc">動画・デザイン・文章などの成果物をつくる</div></div>
            </div>
          </div>
          <div class="add-step" id="step-pattern" style="display:none;">
            <div class="add-step-title">作業パターン</div>
            <div id="pattern-list"></div>
          </div>
          <div class="add-step" id="step-count" style="display:none;">
            <div class="add-step-title">件数</div>
            <div class="count-row">
              <button class="count-btn" id="count-minus">−</button>
              <span class="count-val" id="count-val">1</span>
              <button class="count-btn" id="count-plus">＋</button>
              <span style="font-size:12px;color:var(--text3);">件</span>
            </div>
          </div>
          <div class="add-step" id="step-preview" style="display:none;">
            <div class="add-step-title">ステップ確認・編集</div>
            <div id="subtask-preview"></div>
          </div>
          <div class="add-step" id="step-plot" style="display:none;">
            <div id="plot-info" style="margin-bottom:14px;"></div>
            <div class="add-step-title" style="margin-bottom:6px;">繰り返し（任意）</div>
            <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;" id="repeat-btns">
              <button class="repeat-opt" data-repeat="none">なし</button>
              <button class="repeat-opt" data-repeat="daily">毎日</button>
              <button class="repeat-opt" data-repeat="weekly">毎週</button>
              <button class="repeat-opt" data-repeat="biweekly">隔週</button>

// ============================================================
// BLOCK HELPERS
// ============================================================
function isBlockActiveOnDate(b,targetDate){
  if(b.date===targetDate)return true;
  if(!b.repeat||b.repeat==='none')return false;
  const base=new Date(b.date+'T00:00:00');
  const target=new Date(targetDate+'T00:00:00');
  if(target<base)return false;
  const diffDays=Math.round((target-base)/(1000*60*60*24));
  if(b.repeat==='weekly')return diffDays%7===0;
  if(b.repeat==='biweekly')return diffDays%14===0;
  return false;
}

function getDefaultBlocks(date){
  const sm=(window._dayStartHour||DEFAULT_START_HOUR)*60+(window._dayStartMin||DEFAULT_START_MIN);
  const WORK_END=(window._dayEndHour||DEFAULT_END_HOUR)*60;
  const fixedBlocks=allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,date)).map(b=>{
    const[sh,bsm]=b.start_time.split(':').map(Number);
    const[eh,em]=b.end_time.split(':').map(Number);
    return{start:sh*60+bsm,end:eh*60+em};
  }).sort((a,b)=>a.start-b.start);
  function findFreeSlot(fromMin){let cursor=fromMin;for(const b of fixedBlocks){if(b.start<=cursor&&b.end>cursor)cursor=b.end;}return cursor;}
  const blocks=[];
  const morningMail=findFreeSlot(sm);
  if(morningMail+15<=WORK_END)blocks.push({date,title:'メール・チャット確認',start_time:toTimeStr(morningMail),end_time:toTimeStr(morningMail+15),_default:true});
  if(12*60+60<=WORK_END)blocks.push({date,title:'昼休憩',start_time:'12:00:00',end_time:'13:00:00',_default:true});
  const afternoonMail=findFreeSlot(13*60);
  if(afternoonMail+15<=WORK_END)blocks.push({date,title:'メール・チャット確認（昼後）',start_time:toTimeStr(afternoonMail),end_time:toTimeStr(afternoonMail+15),_default:true});
  return blocks;
}

// ============================================================
// SLOT CALCULATION
// ============================================================
function getAvailableSlots(date,excludeTaskId=null,fromNow=false){
  const sm=(window._dayStartHour||DEFAULT_START_HOUR)*60+(window._dayStartMin||DEFAULT_START_MIN);
  const WORK_END=(window._dayEndHour||DEFAULT_END_HOUR)*60;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const WORK_START=fromNow&&date===TODAY_STR?Math.max(sm,nowMin):sm;
  const allB=[...allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,date)),...getDefaultBlocks(date)];
  const absenceBlocks=[
    ...(date===TODAY_STR?(window._absences||[]).map(a=>({start_time:toTimeStr(a.start),end_time:toTimeStr(a.end)})):[]),
    ...allBlocks.filter(b=>b.date===date&&b._is_absence).map(b=>({start_time:b.start_time,end_time:b.end_time}))
  ];
  const blockedRanges=[...allB,...absenceBlocks].map(b=>{const[bsh,bsm]=b.start_time.split(':').map(Number);const[beh,bem]=b.end_time.split(':').map(Number);return{start:bsh*60+bsm,end:beh*60+bem};});
  const scheduled=allTasks.filter(t=>t.scheduled_date===date&&t.scheduled_time&&t.status!=='done'&&t.id!==excludeTaskId).map(t=>{const[h,m]=t.scheduled_time.split(':').map(Number);return{start:h*60+m,end:h*60+m+(t.estimated_minutes||30)};});
  const busy=[...blockedRanges,...scheduled].sort((a,b)=>a.start-b.start);
  const slots=[];let cursor=WORK_START;
  for(const b of busy){if(b.end<=cursor)continue;if(cursor<b.start)slots.push({start:cursor,end:b.start});cursor=Math.max(cursor,b.end);}
  if(cursor<WORK_END)slots.push({start:cursor,end:WORK_END});
  return slots.filter(s=>s.end>s.start);
}

function autoPlotTime(type,estimatedMin,date,excludeTaskId=null,fromNow=false){
  const slots=getAvailableSlots(date,excludeTaskId,fromNow);
  const needed=estimatedMin+(TYPE_BUFFER[type]||0);
  const sm=(window._dayStartHour||DEFAULT_START_HOUR)*60+(window._dayStartMin||DEFAULT_START_MIN);
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const startFloor=fromNow&&date===TODAY_STR?Math.max(sm,nowMin):sm;
  const NOON=12*60,CONC=16*60;
  let candidates;
  if(type==='judgment'||type==='unknown'||type==='creative'){
    candidates=[...slots.filter(s=>s.start>=startFloor&&s.start<NOON),...slots.filter(s=>s.start>=Math.max(startFloor,CONC)),...slots.filter(s=>s.start>=Math.max(startFloor,NOON)&&s.start<CONC)];
  } else {
    candidates=[...slots.filter(s=>s.start>=startFloor&&s.start<CONC),...slots.filter(s=>s.start>=Math.max(startFloor,CONC))];
  }
  for(const slot of candidates){
    if(slot.end-slot.start>=needed){const h=Math.floor(slot.start/60),m=slot.start%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
  }
  const validSlots=slots.filter(s=>s.start>=startFloor);
  if(validSlots.length){const h=Math.floor(validSlots[0].start/60),m=validSlots[0].start%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
  if(slots.length){const h=Math.floor(slots[0].start/60),m=slots[0].start%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
  return`${String(Math.floor(startFloor/60)).padStart(2,'0')}:${String(startFloor%60).padStart(2,'0')}`;
}

// ============================================================
// PRIORITY SCORING
// ============================================================
function calcPriorityScore(task){
  let score=0;
  if(task.date_pinned)score+=200; // 日付固定は最優先
  if(task.deadline){
    const daysLeft=Math.ceil((new Date(task.deadline)-TODAY)/(1000*60*60*24));
    if(daysLeft<=0)score+=100;
    else if(daysLeft===1)score+=80;
    else if(daysLeft<=3)score+=50;
    else if(daysLeft<=7)score+=20;
  }
  const typeScore={judgment:30,unknown:25,dependent:35,routine:10,creative:25};
  score+=typeScore[task.type]||10;
  if(task.created_at){const daysOld=Math.floor((TODAY-new Date(task.created_at))/(1000*60*60*24));score+=Math.min(daysOld*5,30);}
  if((task.estimated_minutes||30)<=15)score+=10;
  if(task.type==='dependent'&&TODAY.getDay()===5)score-=20;
  return score;
}

function buildReason(task){
  const parts=[];
  if(task.deadline){const d=Math.ceil((new Date(task.deadline)-TODAY)/(1000*60*60*24));if(d<=0)parts.push('期限超過');else if(d===1)parts.push('期限明日');else if(d<=3)parts.push(`期限${d}日`);}
  if(task.type==='judgment'||task.type==='unknown')parts.push('要脳リソース');
  if(task.type==='dependent')parts.push('早めにボールを渡す');
  if(task.created_at){const d=Math.floor((TODAY-new Date(task.created_at))/(1000*60*60*24));if(d>=3)parts.push(`${d}日放置中`);}
  if(task.date_pinned)parts.push('📌日付固定');
  return parts.join(' · ');
}

// ============================================================
// FINISH TIME CALC
// ============================================================
function calcFinishTime(tasks,targetDate=TODAY_STR){
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const sm=(window._dayStartHour||DEFAULT_START_HOUR)*60+(window._dayStartMin||DEFAULT_START_MIN);
  const startMin=targetDate===TODAY_STR?nowMin:sm;
  const WORK_END_MAX=24*60;
  const allDayB=[...allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,targetDate)),...getDefaultBlocks(targetDate)];
  const blockRanges=allDayB.map(b=>{const[sh,bsm]=b.start_time.split(':').map(Number);const[eh,em]=b.end_time.split(':').map(Number);return{start:sh*60+bsm,end:eh*60+em};}).filter(r=>r.end>startMin).sort((a,b)=>a.start-b.start);
  let cursor=startMin;
  for(const min of tasks.map(t=>t.estimated_minutes||30)){
    let placed=false;
    while(!placed){
      const block=blockRanges.find(b=>b.start<=cursor&&b.end>cursor);
      if(block)cursor=block.end;
      const nextBlock=blockRanges.find(b=>b.start>cursor);
      const spaceEnd=nextBlock?nextBlock.start:WORK_END_MAX;
      if(spaceEnd-cursor>=min){cursor+=min;placed=true;}
      else{if(nextBlock)cursor=nextBlock.end;else{cursor+=min;placed=true;}}
    }
  }
  return cursor;
}

  const todayAvailable=nowMin<WORK_END;

  // 全未完了・非固定タスクをスコア順に並べる
  const targets=allTasks.filter(t=>t.status==='pending'&&!t.pinned)
    .map(t=>({...t,score:calcPriorityScore(t)}))
    .sort((a,b)=>b.score-a.score);

  // コンフリクト検出（今日のブロックと重なるタスクを最優先）
  const allTodayBlocks=[...allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,TODAY_STR)),...getDefaultBlocks(TODAY_STR)];
  const conflictIds=new Set();
  targets.filter(t=>t.scheduled_date===TODAY_STR&&t.scheduled_time).forEach(t=>{
    const[th,tm]=t.scheduled_time.split(':').map(Number);
    const tS=th*60+tm,tE=tS+(t.estimated_minutes||30);
    allTodayBlocks.forEach(b=>{
      const[bsh,bsm]=b.start_time.split(':').map(Number);const[beh,bem]=b.end_time.split(':').map(Number);
      if(tS<beh*60+bem&&tE>bsh*60+bsm)conflictIds.add(t.id);
    });
  });
  targets.forEach(t=>{if(conflictIds.has(t.id))t.score=99999;});
  targets.sort((a,b)=>b.score-a.score);

  // 仮想スロット構築（繰り返しブロック考慮）
  function getVirtualSlots(date){
    const startMin=date===TODAY_STR?Math.max(sm,nowMin):sm;
    const allB=[...allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,date)),...getDefaultBlocks(date)];
    const absenceBlocks=date===TODAY_STR?(window._absences||[]).map(a=>({start_time:toTimeStr(a.start),end_time:toTimeStr(a.end)})):[];
    const pinnedTasks=allTasks.filter(t=>t.status==='pending'&&t.pinned&&t.scheduled_date===date);
    const busy=[
      ...[...allB,...absenceBlocks].map(b=>{const[sh,bsm2]=b.start_time.split(':').map(Number);const[eh,em]=b.end_time.split(':').map(Number);return{start:sh*60+bsm2,end:eh*60+em};}),
      ...pinnedTasks.filter(t=>t.scheduled_time).map(t=>{const[h,m]=t.scheduled_time.split(':').map(Number);return{start:h*60+m,end:h*60+m+(t.estimated_minutes||30)};})
    ].sort((a,b)=>a.start-b.start);
    const slots=[];let cursor=startMin;
    for(const b of busy){if(b.end<=cursor)continue;if(cursor<b.start)slots.push({start:cursor,end:b.start});cursor=Math.max(cursor,b.end);}
    if(cursor<WORK_END)slots.push({start:cursor,end:WORK_END});
    return slots.filter(s=>s.end>s.start);
  }

  const virtualSlots={
    [TODAY_STR]:todayAvailable?getVirtualSlots(TODAY_STR):[],
    [TOMORROW_STR]:getVirtualSlots(TOMORROW_STR),
    [DAY_AFTER_STR]:getVirtualSlots(DAY_AFTER_STR)
  };

  function pickSlot(date,type,min){
    const startFloor=date===TODAY_STR?Math.max(sm,nowMin):sm;
    const NOON=12*60,CONC=16*60;
    const slots=virtualSlots[date]||[];
    let idxs=[];
    if(type==='judgment'||type==='unknown'||type==='creative'){
      idxs=[
        ...slots.map((s,i)=>({s,i})).filter(({s})=>s.start>=startFloor&&s.start<NOON).map(({i})=>i),
        ...slots.map((s,i)=>({s,i})).filter(({s})=>s.start>=Math.max(startFloor,CONC)).map(({i})=>i),
        ...slots.map((s,i)=>({s,i})).filter(({s})=>s.start>=Math.max(startFloor,NOON)&&s.start<CONC).map(({i})=>i)
      ];
    } else {
      idxs=[
        ...slots.map((s,i)=>({s,i})).filter(({s})=>s.start>=startFloor&&s.start<CONC).map(({i})=>i),
        ...slots.map((s,i)=>({s,i})).filter(({s})=>s.start>=Math.max(startFloor,CONC)).map(({i})=>i)
      ];
    }
    const needed=min+(TYPE_BUFFER[type]||0);
    for(const idx of idxs){
      const slot=slots[idx];if(!slot)continue;
      if(slot.end-slot.start>=needed){
        const h=Math.floor(slot.start/60),m=slot.start%60;
        const timeStr=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        const newStart=slot.start+min;
        if(newStart<slot.end)slots[idx]={start:newStart,end:slot.end};else slots.splice(idx,1);
        return timeStr;
      }
    }
    // フォールバック：空きに収まらなくても最初のスロットを使う
    const vi=slots.findIndex(s=>s.start>=startFloor);
    if(vi>=0){
      const slot=slots[vi];const h=Math.floor(slot.start/60),m=slot.start%60;
      const timeStr=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const newStart=slot.start+min;
      if(newStart<slot.end)slots[vi]={start:newStart,end:slot.end};else slots.splice(vi,1);
      return timeStr;
    }
    return null; // 入らない
  }

  function pickDate(task){
    if(task.date_pinned&&task.scheduled_date)return task.scheduled_date; // 日付固定は動かさない
    if(task.type==='dependent'&&now.getDay()===5)return nextBizDay(TODAY,1);
    if(task.deadline){const dl=Math.ceil((new Date(task.deadline)-TODAY)/(1000*60*60*24));if(dl<=0)return TODAY_STR;}
    // 空き枠に収まるタスクを探して詰める
    if(todayAvailable){
      const remToday=virtualSlots[TODAY_STR].reduce((a,s)=>a+(s.end-s.start),0);
      if(remToday>=(task.estimated_minutes||30))return TODAY_STR;
    }
    const remTomorrow=virtualSlots[TOMORROW_STR].reduce((a,s)=>a+(s.end-s.start),0);
    if(remTomorrow>=(task.estimated_minutes||30))return TOMORROW_STR;
    return DAY_AFTER_STR;
  }

  // 全タスクを再配置
  const updates=[];
  for(const task of targets){
    const targetDate=pickDate(task);
    const newTime=pickSlot(targetDate,task.type,task.estimated_minutes||30);
    const currentDate=normalizeDate(task.scheduled_date);
    const currentTime=(task.scheduled_time||'').slice(0,5);
    if(currentDate!==targetDate||(newTime&&currentTime!==newTime.slice(0,5))){
      updates.push({task,targetDate,newTime:newTime||task.scheduled_time});
    }
  }

  // 期限切れの日付固定タスクを今日に移動・固定解除
  const overdueFixed=allTasks.filter(t=>{
    if(!t.date_pinned||t.status==='done')return false;
    if(!t.deadline)return false;
    const dl=Math.ceil((new Date(t.deadline)-TODAY)/(1000*60*60*24));
    return dl<=0&&t.scheduled_date!==TODAY_STR;
  });
  for(const t of overdueFixed){
    const newTime=pickSlot(TODAY_STR,t.type,t.estimated_minutes||30)||autoPlotTime(t.type,t.estimated_minutes||30,TODAY_STR,null,true);
    updates.push({task:t,targetDate:TODAY_STR,newTime,clearDatePin:true});
  }

  await Promise.all(updates.map(async({task,targetDate,newTime,clearDatePin})=>{
    const upd={scheduled_date:targetDate,scheduled_time:newTime};
    if(clearDatePin)upd.date_pinned=false;
    await db.from('tasks').update(upd).eq('id',task.id);
    const t=allTasks.find(x=>x.id===task.id);
    if(t){t.scheduled_date=targetDate;t.scheduled_time=newTime;if(clearDatePin)t.date_pinned=false;}
  }));

  _optimizeNeeded=false;
  _lastOptimizeTime=new Date();
  renderOptimizeBtn();
  renderSchedule();
  renderUnplacedBanner();
  showFinishBanner();
  if(document.getElementById('page-plan').classList.contains('active'))renderPlan();
};

function showFinishBanner(){
  const banner=document.getElementById('finish-banner');
  if(!banner)return;
  const todayTasks=allTasks.filter(t=>t.scheduled_date===TODAY_STR&&t.status==='pending')
    .sort((a,b)=>(a.scheduled_time||'99:99').localeCompare(b.scheduled_time||'99:99'));
  if(!todayTasks.length){banner.innerHTML='';return;}
  const finishMin=calcFinishTime(todayTasks);
  const fh=Math.floor(finishMin/60),fm=finishMin%60;
  const finishStr=`${String(fh).padStart(2,'0')}:${String(fm).padStart(2,'0')}`;
  const now=new Date();
  const timeLabel=`${String(_lastOptimizeTime?_lastOptimizeTime.getHours():now.getHours()).padStart(2,'0')}:${String(_lastOptimizeTime?_lastOptimizeTime.getMinutes():now.getMinutes()).padStart(2,'0')}時点`;
  banner.innerHTML=`
    <div style="background:var(--green);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:2px;">${timeLabel}</div>
        <div style="font-size:14px;font-weight:500;color:white;">今日は <span style="font-family:var(--font-num);font-size:20px;">${finishStr}</span> 終わりになります</div>
      </div>
      <button onclick="document.getElementById('finish-banner').innerHTML=''" style="width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:white;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>`;
}

function renderUnplacedBanner(){

// 終業時間変更時のアラート
function checkEndTimeAlert(){
  const ehMin=(window._dayEndHour||DEFAULT_END_HOUR)*60;
  const datePinnedOver=allTasks.filter(t=>{
    if(!t.date_pinned||t.status==='done'||t.scheduled_date!==TODAY_STR)return false;
    if(!t.scheduled_time)return false;
    const[h,m]=t.scheduled_time.split(':').map(Number);
    return h*60+m+(t.estimated_minutes||30)>ehMin;
  });
  if(!datePinnedOver.length)return;
  const names=datePinnedOver.map(t=>t.title).join('・');
  const finishMin=calcFinishTime(datePinnedOver);
  const fh=Math.floor(finishMin/60),fm=finishMin%60;
  showToast(`⚠️ ${names}は日付固定のため${String(fh).padStart(2,'0')}:${String(fm).padStart(2,'0')}まで残ります`);
}

function renderSchedule(){
  const wrap=document.getElementById('schedule-list');if(!wrap)return;
  const todayTasks=allTasks.filter(t=>t.scheduled_date===TODAY_STR).sort((a,b)=>(a.scheduled_time||'99:99').localeCompare(b.scheduled_time||'99:99'));
  const fixedBlocks=allBlocks.filter(b=>!b._is_absence&&isBlockActiveOnDate(b,TODAY_STR));
  const defaultBlocks=getDefaultBlocks(TODAY_STR);
  const absenceBlocks=(window._absences||[]).map(a=>({date:TODAY_STR,title:a.label||'不在',start_time:toTimeStr(a.start),end_time:toTimeStr(a.end),_absence:true}));
  const items=[
    ...fixedBlocks.map(b=>({type:'block',time:b.start_time,data:b})),
    ...defaultBlocks.map(b=>({type:'block',time:b.start_time,data:b})),
    ...absenceBlocks.map(b=>({type:'block',time:b.start_time,data:b})),
    ...todayTasks.map(t=>({type:'task',time:t.scheduled_time||'99:99',data:t}))
  ].sort((a,b)=>a.time.localeCompare(b.time));
  // 未配置タスク（時刻なし）
  const unplacedToday=allTasks.filter(t=>t.scheduled_date===TODAY_STR&&!t.scheduled_time&&t.status!=='done');
  const ws=(window._dayStartHour||DEFAULT_START_HOUR)*60+(window._dayStartMin||DEFAULT_START_MIN);
  const we=(window._dayEndHour||DEFAULT_END_HOUR)*60;
  // gap計算
  const busyRanges=items.filter(it=>it.type==='block'||(it.type==='task'&&it.data.status!=='done'&&it.data.scheduled_time)).map(it=>{
    if(it.type==='block'){const[sh,sm]=it.data.start_time.split(':').map(Number);const[eh,em]=it.data.end_time.split(':').map(Number);return{start:sh*60+sm,end:eh*60+em};}
    const[sh,sm]=it.data.scheduled_time.split(':').map(Number);return{start:sh*60+sm,end:sh*60+sm+(it.data.estimated_minutes||0)};
  }).sort((a,b)=>a.start-b.start);
  const mrg=[];for(const b of busyRanges){if(mrg.length&&b.start<=mrg[mrg.length-1].end)mrg[mrg.length-1].end=Math.max(mrg[mrg.length-1].end,b.end);else mrg.push({...b});}
  const gaps=[];let cur=ws;
  for(const b of mrg){if(b.start>cur+5){const h2=Math.floor(cur/60),m2=cur%60;gaps.push({type:'gap',time:`${String(h2).padStart(2,'0')}:${String(m2).padStart(2,'0')}`,gapMin:b.start-cur});}cur=Math.max(cur,b.end);}
  if(cur<we-5){const h2=Math.floor(cur/60),m2=cur%60;gaps.push({type:'gap',time:`${String(h2).padStart(2,'0')}:${String(m2).padStart(2,'0')}`,gapMin:we-cur});}
  const allItems=[...items,...gaps].sort((a,b)=>a.time.localeCompare(b.time));
  if(!allItems.length&&!unplacedToday.length){wrap.innerHTML='<div class="empty">今日のスケジュールはありません</div>';return;}
  wrap.innerHTML='<div class="sched-line-bar"></div>';
  wrap.className='sched-wrap';
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const nowStr=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let nowLineInserted=false;
  allItems.forEach((item)=>{
    if(!nowLineInserted){
      const itemMin=item.time==='99:99'?9999:parseInt(item.time.split(':')[0])*60+parseInt(item.time.split(':')[1]);
      if(itemMin>nowMin){nowLineInserted=true;const nowRow=document.createElement('div');nowRow.className='sched-row';nowRow.innerHTML=`<div class="sched-dot active-dot"></div><div class="sched-time now-time">${nowStr}</div><div class="sched-content"></div>`;wrap.appendChild(nowRow);}
    }
    const row=document.createElement('div');row.className='sched-row';
    const timeStr=item.time==='99:99'?'--:--':item.time.slice(0,5);
    if(item.type==='gap'){
      row.innerHTML=`<div class="sched-dot" style="background:var(--bg2);border:1.5px dashed var(--text3);"></div><div class="sched-time" style="opacity:.4;">${timeStr}</div><div class="sched-content"><div style="font-size:11px;color:var(--text3);padding:3px 0;">空き ${item.gapMin}min</div></div>`;
    } else if(item.type==='block'){
      const b=item.data,isDef=b._default||false,isAbs=b._absence||false;
      const blockLabel=isAbs?b.title:isDef?'自動':'固定';
      const editBtn=(!isDef&&!isAbs&&b.id)?`<button onclick="openBlockModal('${b.id}')" style="font-size:11px;color:var(--accent);background:none;border:0.5px solid var(--accent);border-radius:5px;padding:2px 8px;cursor:pointer;font-family:var(--font);">編集</button>`:'';
      row.innerHTML=`<div class="sched-dot block-dot" style="${isDef&&!isAbs?'opacity:.4':''}"></div><div class="sched-time" style="${isDef&&!isAbs?'opacity:.5':''}">${timeStr}</div><div class="sched-content"><div class="task-card block-card" style="${isAbs?'background:#FFF3E0;border-color:#FFCC80;':isDef?'opacity:.6;border-style:dashed;':''}"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-block">${blockLabel}</div><span class="task-title">${b.title}</span></div><div style="display:flex;align-items:center;gap:8px;"><span class="task-time">${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span>${editBtn}</div></div></div></div>`;
    } else {
      const t=item.data,subs=allSubtasks.filter(s=>s.task_id===t.id),reason=buildReason(t);
      const isDone=t.status==='done';
      const doneCount=subs.filter(s=>s.status==='done').length;
      if(isDone){
        row.innerHTML=`<div class="sched-dot done-dot"></div><div class="sched-time" style="opacity:.4;">${timeStr}</div><div class="sched-content"><div class="task-card done" data-id="${t.id}" style="cursor:pointer;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title" style="text-decoration:line-through;">${t.title}</span></div><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" fill="var(--accent)"/><polyline points="4,7 6,9 10,5" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></div></div></div>`;
        row.querySelector('.task-card').addEventListener('click',()=>openDetail(t.id));
      } else {
        const pinnedClass=t.pinned?'pinned':t.date_pinned?'date-pinned':'';
        row.innerHTML=`<div class="sched-dot"></div><div class="sched-time">${timeStr}</div><div class="sched-content"><div class="task-card ${pinnedClass}" data-id="${t.id}"><div class="task-card-top"><div class="task-card-left"><button class="sched-done-btn" data-id="${t.id}" style="width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bg3);background:var(--white);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;"></button><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">${subs.length?`<span style="font-size:10px;color:var(--text3);">${doneCount}/${subs.length}</span>`:''}<span class="task-time">${t.estimated_minutes}min</span><button class="pin-switch ${t.pinned?'on':''}" data-id="${t.id}" title="時刻固定"></button>${subs.length?`<div class="sub-toggle" data-tid="${t.id}" style="width:18px;height:18px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path class="tarr" d="M2 3.5L5 6.5L8 3.5" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg></div>`:''}</div></div><div class="subtask-list" id="sl-${t.id}" style="display:none;">${subs.map(s=>`<div class="subtask-item"><div class="subtask-check ${s.status==='done'?'done':''}" data-sub-id="${s.id}">${s.status==='done'?'<svg width="7" height="7" viewBox="0 0 7 7"><polyline points="1,3.5 2.8,5.5 6,1.5" stroke="white" stroke-width="1.5" fill="none"/></svg>':''}</div><span class="subtask-title ${s.status==='done'?'done':''}">${s.title}</span><span class="subtask-min">${s.estimated_minutes}min</span></div>`).join('')}</div>${reason?`<div class="task-reason">${reason}</div>`:''}</div></div>`;
        row.querySelector('.task-card').addEventListener('click',e=>{if(e.target.closest('.sub-toggle')||e.target.closest('.subtask-check')||e.target.closest('.pin-switch')||e.target.closest('.sched-done-btn'))return;openDetail(t.id);});
        row.querySelector('.sched-done-btn')?.addEventListener('click',e=>{e.stopPropagation();toggleTask(t.id);});
        row.querySelector('.pin-switch')?.addEventListener('click',e=>{e.stopPropagation();togglePin(t.id);});
        const tog=row.querySelector('.sub-toggle');
        if(tog)tog.addEventListener('click',e=>{e.stopPropagation();const sl=document.getElementById('sl-'+tog.dataset.tid);const open=sl.style.display!=='none';sl.style.display=open?'none':'flex';tog.querySelector('.tarr').setAttribute('d',open?'M2 3.5L5 6.5L8 3.5':'M2 6.5L5 3.5L8 6.5');});
        row.querySelectorAll('.subtask-check').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleSubtask(el.dataset.subId);}));
      }
    }
    wrap.appendChild(row);
  });
  // 未配置タスク
  if(unplacedToday.length){
    const unplacedRow=document.createElement('div');
    unplacedRow.style.cssText='margin-top:12px;padding-top:12px;border-top:0.5px dashed var(--bg3);';
    unplacedRow.innerHTML=`<div style="font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">未配置 ${unplacedToday.length}件</div>`;
    unplacedToday.forEach(t=>{
      const card=document.createElement('div');card.className='task-card';card.style.opacity='.7';
      card.innerHTML=`<div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.estimated_minutes}min</span></div>`;
      card.addEventListener('click',()=>openDetail(t.id));
      unplacedRow.appendChild(card);
    });
    wrap.appendChild(unplacedRow);
  }
}

function renderPlan(){
  const board=document.getElementById('plan-board');if(!board)return;
  const now=new Date();
  const d1=new Date(TODAY);const d2=new Date(TODAY);d2.setDate(TODAY.getDate()+1);
  const d3=new Date(TODAY);d3.setDate(TODAY.getDate()+2);
  const cols=[
    {key:TODAY_STR,label:fmt(d1),tasks:[]},
    {key:TOMORROW_STR,label:fmt(d2),tasks:[]},
    {key:DAY_AFTER_STR,label:fmt(d3),tasks:[]},
    {key:'later',label:'以降',tasks:[]},
    {key:'unassigned',label:'未分配',tasks:[]}
  ];
  allTasks.filter(t=>t.status==='pending').forEach(t=>{
    if(!t.scheduled_date){cols[4].tasks.push(t);}
    else if(t.scheduled_date===TODAY_STR){cols[0].tasks.push(t);}
    else if(t.scheduled_date===TOMORROW_STR){cols[1].tasks.push(t);}
    else if(t.scheduled_date===DAY_AFTER_STR){cols[2].tasks.push(t);}
    else{cols[3].tasks.push(t);}
  });
  board.innerHTML='';
  cols.forEach(col=>{
    // 終了時間計算（今日・明日・明後日のみ）
    let finishLabel='';
    if(col.key!=='later'&&col.key!=='unassigned'){
      const sorted=col.tasks.filter(t=>t.scheduled_time).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||''));
      if(sorted.length){
        const fm=calcFinishTime(sorted,col.key);
        const fh=Math.floor(fm/60),fmm=fm%60;
        finishLabel=`${String(fh).padStart(2,'0')}:${String(fmm).padStart(2,'0')}終了予定`;
      }
    }
    const colEl=document.createElement('div');
    colEl.className='plan-col';
    colEl.dataset.date=col.key;
    colEl.innerHTML=`
      <div class="plan-col-header">
        <div class="plan-col-date">${col.label} <span style="font-size:10px;color:var(--text3);font-weight:400;">${col.tasks.length}件</span></div>
        ${finishLabel?`<div class="plan-col-finish">${finishLabel}</div>`:''}
      </div>
      <div class="plan-col-body" id="col-body-${col.key}"></div>`;
    // 後でカードを追加してるのでdrag-overのスタイルは後から操作
    const body=colEl.querySelector('.plan-col-body');
    col.tasks.sort((a,b)=>(a.scheduled_time||'99:99').localeCompare(b.scheduled_time||'99:99')).forEach(t=>{
      const card=createPlanCard(t);
      body.appendChild(card);
    });
    // drag-over イベント
    colEl.addEventListener('dragover',e=>{e.preventDefault();colEl.classList.add('drag-over');});
    colEl.addEventListener('dragleave',()=>colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop',e=>{
      e.preventDefault();colEl.classList.remove('drag-over');
      const taskId=e.dataTransfer.getData('taskId');
      const targetDate=col.key==='later'?DAY3_STR:col.key==='unassigned'?null:col.key;
      dropTask(taskId,targetDate);
    });
    board.appendChild(colEl);
  });
}

function createPlanCard(t){
  const card=document.createElement('div');
  card.className=`plan-task-card${t.date_pinned?' date-pinned':''}`;
  card.draggable=true;
  card.dataset.taskId=t.id;
  const timeLabel=t.scheduled_time?t.scheduled_time.slice(0,5):'';
  card.innerHTML=`
    <div class="plan-task-title">${t.title}</div>
    <div class="plan-task-meta">
      <span class="task-type-badge type-${t.type}" style="font-size:8px;">${typeLabel(t.type)}</span>
      <span style="font-size:10px;color:var(--text3);font-family:var(--font-num);">${t.estimated_minutes}min</span>
      ${timeLabel?`<span style="font-size:10px;color:var(--text3);font-family:var(--font-num);">${timeLabel}</span>`:''}
      ${t.deadline?`<span style="font-size:10px;color:var(--accent);">期限${t.deadline.slice(5).replace('-','/')}</span>`:''}
      ${t.repeat&&t.repeat!=='none'?`<span style="font-size:10px;color:#4A6FA5;">🔁${{daily:'毎日',weekly:'毎週',biweekly:'隔週'}[t.repeat]}</span>`:''}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
      <button class="date-pin-toggle" data-id="${t.id}" style="font-size:10px;color:${t.date_pinned?'#4A6FA5':'var(--text3)'};background:none;border:0.5px solid ${t.date_pinned?'#4A6FA5':'var(--sep)'};border-radius:4px;padding:2px 6px;cursor:pointer;font-family:var(--font);">${t.date_pinned?'📌固定中':'固定'}</button>
    </div>`;
  card.addEventListener('dragstart',e=>{e.dataTransfer.setData('taskId',t.id);card.classList.add('dragging');});
  card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  card.querySelector('.date-pin-toggle').addEventListener('click',e=>{e.stopPropagation();toggleDatePin(t.id);});
  card.addEventListener('click',e=>{if(e.target.closest('.date-pin-toggle'))return;openDetail(t.id);});
  return card;
}

async function dropTask(taskId,targetDate){
  const task=allTasks.find(t=>t.id===taskId);if(!task)return;
  const upd={scheduled_date:targetDate,scheduled_time:null,date_pinned:targetDate?true:false};
  await db.from('tasks').update(upd).eq('id',taskId);
  task.scheduled_date=targetDate;task.scheduled_time=null;task.date_pinned=targetDate?true:false;
  markOptimizeNeeded();
  renderPlan();
  renderToday();
}

async function toggleDatePin(taskId){
  const task=allTasks.find(t=>t.id===taskId);if(!task)return;
  const newVal=!task.date_pinned;
  await db.from('tasks').update({date_pinned:newVal}).eq('id',taskId);
  task.date_pinned=newVal;
  markOptimizeNeeded();
  renderPlan();
}

// ============================================================
// TOGGLE
// ============================================================
async function toggleTask(taskId){
  const task=allTasks.find(t=>t.id===taskId);if(!task)return;
  const ns=task.status==='done'?'pending':'done';
  await db.from('tasks').update({status:ns}).eq('id',taskId);
  task.status=ns;
  if(ns==='done'&&task.repeat&&task.repeat!=='none')await generateNextRepeatTask(task);
  markOptimizeNeeded();
  renderToday();
  if(ns==='done')showToast('完了！🐯');
}

async function toggleSubtask(subId){
  const sub=allSubtasks.find(s=>s.id===subId);if(!sub)return;
  const ns=sub.status==='done'?'pending':'done';
  await db.from('subtasks').update({status:ns}).eq('id',subId);
  sub.status=ns;renderToday();
}

async function togglePin(taskId){
  const task=allTasks.find(t=>t.id===taskId);if(!task)return;
  const newVal=!task.pinned;
  await db.from('tasks').update({pinned:newVal}).eq('id',taskId);
  task.pinned=newVal;renderToday();
}

async function generateNextRepeatTask(completedTask){
  // 重複チェック：タイトル＋repeat＋repeat_originの3つ一致
  const existing=allTasks.find(t=>
    t.id!==completedTask.id&&t.status==='pending'&&
    t.repeat===completedTask.repeat&&t.title===completedTask.title&&
    t.repeat_origin===completedTask.repeat_origin
  );
  if(existing)return;
  const base=new Date(completedTask.scheduled_date+'T00:00:00');
  let nextDate=new Date(base);
  if(completedTask.repeat==='daily')nextDate.setDate(nextDate.getDate()+1);
  else if(completedTask.repeat==='weekly')nextDate.setDate(nextDate.getDate()+7);
  else if(completedTask.repeat==='biweekly')nextDate.setDate(nextDate.getDate()+14);
  while(nextDate<TODAY){
    if(completedTask.repeat==='daily')nextDate.setDate(nextDate.getDate()+1);
    else if(completedTask.repeat==='weekly')nextDate.setDate(nextDate.getDate()+7);
    else if(completedTask.repeat==='biweekly')nextDate.setDate(nextDate.getDate()+14);
  }
  const nextDateStr=localDateStr(nextDate);
  const{data:newTask}=await db.from('tasks').insert({
    user_id:currentUser.id,title:completedTask.title,type:completedTask.type,status:'pending',
    estimated_minutes:completedTask.estimated_minutes||30,deadline:null,
    scheduled_date:nextDateStr,scheduled_time:null,pinned:false,date_pinned:false,
    repeat:completedTask.repeat,repeat_origin:completedTask.repeat_origin||completedTask.scheduled_date,
    memo:completedTask.memo||null
  }).select().single();
  if(newTask){
    newTask.scheduled_date=normalizeDate(newTask.scheduled_date);
    allTasks.unshift(newTask);
    const origSubs=allSubtasks.filter(s=>s.task_id===completedTask.id);
    if(origSubs.length){
      const{data:saved}=await db.from('subtasks').insert(origSubs.map((s,i)=>({task_id:newTask.id,title:s.title,estimated_minutes:s.estimated_minutes||30,status:'pending',sort_order:i}))).select();
      if(saved)allSubtasks.push(...saved);
    }
    markOptimizeNeeded();
  }
}

async function confirmDelete(taskId){
  if(!confirm('削除しますか？'))return;
  await db.from('tasks').delete().eq('id',taskId);
  await db.from('subtasks').delete().eq('task_id',taskId);
  allTasks=allTasks.filter(t=>t.id!==taskId);
  allSubtasks=allSubtasks.filter(s=>s.task_id!==taskId);
  closeModal('detail-modal');markOptimizeNeeded();showToast('削除しました');
  renderToday();if(document.getElementById('page-plan').classList.contains('active'))renderPlan();
}

async function deleteAllRepeat(task){
  if(!confirm('繰り返しタスクをすべて削除しますか？'))return;
  const toDelete=allTasks.filter(t=>t.status==='pending'&&t.title===task.title&&t.repeat===task.repeat&&t.repeat_origin===task.repeat_origin);
  for(const t of toDelete){
    await db.from('tasks').delete().eq('id',t.id);
    await db.from('subtasks').delete().eq('task_id',t.id);
  }
  allTasks=allTasks.filter(t=>!toDelete.find(d=>d.id===t.id));
  allSubtasks=allSubtasks.filter(s=>!toDelete.find(d=>d.id===s.task_id));
  closeModal('detail-modal');markOptimizeNeeded();showToast('繰り返しタスクを削除しました');
  renderToday();if(document.getElementById('page-plan').classList.contains('active'))renderPlan();
}

function renderSetup(){
  // 始業時間の選択状態
  const sh=window._dayStartHour||DEFAULT_START_HOUR;
  const sm2=window._dayStartMin||DEFAULT_START_MIN;
  document.querySelectorAll('#start-opts .time-opt').forEach(btn=>{
    const bh=parseInt(btn.dataset.h),bm=parseInt(btn.dataset.m||0);
    btn.classList.toggle('selected',bh===sh&&bm===sm2);
  });
  // 終業時間の選択状態
  const eh=window._dayEndHour||DEFAULT_END_HOUR;
  document.querySelectorAll('#end-opts .time-opt').forEach(btn=>{
    btn.classList.toggle('selected',parseInt(btn.dataset.h)===eh);
  });
  // 不在リスト
  renderAbsenceList();
  // ブロックリスト
  renderBlockListSetup();
  // 不在日リスト
  renderFutureAbsenceList();
  // 時刻セレクト
  ['absence-start','absence-end','future-absence-start','future-absence-end'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel||sel.options.length>1)return;
    for(let h=6;h<=22;h++)for(let m=0;m<60;m+=30)sel.add(new Option(`${h}:${String(m).padStart(2,'0')}`,h*60+m));
  });
}

function renderAbsenceList(){
  const list=document.getElementById('absence-list');if(!list)return;
  const absences=window._absences||[];
  list.innerHTML=absences.map((a,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;"><span>${a.label||''} ${toTimeStr(a.start).slice(0,5)}〜${toTimeStr(a.end).slice(0,5)}</span><button onclick="removeAbsence(${i})" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:var(--font);">削除</button></div>`).join('');
}

window.removeAbsence=function(i){window._absences=(window._absences||[]).filter((_,idx)=>idx!==i);saveSettings();renderAbsenceList();markOptimizeNeeded();};

function renderBlockListSetup(){
  const list=document.getElementById('block-list-setup');if(!list)return;
  const blocks=allBlocks.filter(b=>!b._is_absence).sort((a,b)=>a.date.localeCompare(b.date)||a.start_time.localeCompare(b.start_time));
  if(!blocks.length){list.innerHTML='<div style="font-size:12px;color:var(--text3);padding:8px 0;">登録された会議はありません</div>';return;}

function renderFutureAbsenceList(){
  const list=document.getElementById('future-absence-list');if(!list)return;
  const futures=allBlocks.filter(b=>b._is_absence&&b.date>=TODAY_STR).sort((a,b)=>a.date.localeCompare(b.date));
  list.innerHTML=futures.map(b=>`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;"><span>${b.date} ${b.title} ${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span><button onclick="deleteFutureAbsence('${b.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:var(--font);">削除</button></div>`).join('');

window.deleteFutureAbsence=async function(id){

// 設定保存
document.getElementById('setup-save-btn').addEventListener('click',async()=>{
  const sh=parseInt(document.querySelector('#start-opts .time-opt.selected')?.dataset.h||DEFAULT_START_HOUR);
  const sm2=parseInt(document.querySelector('#start-opts .time-opt.selected')?.dataset.m||DEFAULT_START_MIN);
  const eh=parseInt(document.querySelector('#end-opts .time-opt.selected')?.dataset.h||DEFAULT_END_HOUR);
  const prevEh=window._dayEndHour||DEFAULT_END_HOUR;
  window._dayStartHour=sh;window._dayStartMin=sm2;
  setEndHour(eh);
  saveSettings();
  // 終業時間が短くなった場合、はみ出るタスクを明日以降に移動
  if(eh<prevEh){
    const ehMin=eh*60;
    const overTasks=allTasks.filter(t=>{
      if(t.scheduled_date!==TODAY_STR||t.status==='done'||t.pinned||t.date_pinned)return false;
      if(!t.scheduled_time)return false;
      const[h,m]=t.scheduled_time.split(':').map(Number);
      return h*60+m+(t.estimated_minutes||30)>ehMin;
    });
    for(const t of overTasks){
      await db.from('tasks').update({scheduled_date:TOMORROW_STR,scheduled_time:null}).eq('id',t.id);
      t.scheduled_date=TOMORROW_STR;t.scheduled_time=null;
    }
    // アラート：日付固定タスクが終業超えの場合
    checkEndTimeAlert();
  }
  markOptimizeNeeded();
  showToast('設定を保存しました');
  renderToday();
});

let _editingBlockId=null;
function openBlockModal(blockId){
  _editingBlockId=blockId;
  const title=document.getElementById('block-modal-title');
  const saveBtn=document.getElementById('block-save-btn');
  const deleteBtn=document.getElementById('block-delete-btn');
  if(blockId){
    const b=allBlocks.find(x=>x.id===blockId);if(!b)return;
    title.textContent='会議・MTGを編集';saveBtn.textContent='更新する';deleteBtn.style.display='block';
    document.getElementById('block-title').value=b.title;
    document.getElementById('block-start').value=b.start_time.slice(0,5);
    document.getElementById('block-end').value=b.end_time.slice(0,5);
    document.getElementById('block-date').value=b.date;
    document.getElementById('block-repeat').value=b.repeat||'none';
  } else {
    title.textContent='会議・MTGを追加';saveBtn.textContent='追加する';deleteBtn.style.display='none';
    document.getElementById('block-title').value='';
    document.getElementById('block-date').value=TODAY_STR;
    document.getElementById('block-repeat').value='none';
  }
  openModal('block-modal');
}
window.openBlockModal=openBlockModal;

document.getElementById('block-save-btn').addEventListener('click',async()=>{
  const title=document.getElementById('block-title').value.trim();
  const start=document.getElementById('block-start').value;
  const end=document.getElementById('block-end').value;
  const date=document.getElementById('block-date').value;
  const repeatVal=document.getElementById('block-repeat').value;
  if(!title||!start||!end||!date){showToast('すべての項目を入力してください');return;}
  if(_editingBlockId){
    await db.from('blocks').update({title,start_time:start+':00',end_time:end+':00',date,repeat:repeatVal}).eq('id',_editingBlockId);
    const b=allBlocks.find(x=>x.id===_editingBlockId);
    if(b){b.title=title;b.start_time=start+':00';b.end_time=end+':00';b.date=date;b.repeat=repeatVal;}
    showToast('更新しました');
  } else {
    const{data}=await db.from('blocks').insert({user_id:currentUser.id,title,start_time:start+':00',end_time:end+':00',date,repeat:repeatVal||'none'}).select().single();
    if(data)allBlocks.push(data);
    showToast('固定ブロックを追加しました');
  }
  closeModal('block-modal');markOptimizeNeeded();
  renderToday();renderBlockListSetup();
});

document.getElementById('block-delete-btn').addEventListener('click',async()=>{
  if(!_editingBlockId||!confirm('削除しますか？'))return;
  await db.from('blocks').delete().eq('id',_editingBlockId);
  allBlocks=allBlocks.filter(b=>b.id!==_editingBlockId);
  closeModal('block-modal');markOptimizeNeeded();showToast('削除しました');
  renderToday();renderBlockListSetup();
});

function initAddPage(){
  addState={type:null,patternKey:null,count:1,subtasks:[],totalMin:0,repeat:'none'};
  const ne=document.getElementById('task-name-input');if(ne)ne.value='';
  const me=document.getElementById('memo-input');if(me)me.value='';

  });

function renderDeadlineCalendar(){
  const wrap=document.getElementById('deadline-calendar');if(!wrap)return;
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const monthName=`${calYear}年${calMonth+1}月`;
  let cells='';
  for(let i=0;i<firstDay;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===TODAY_STR,isPast=dateStr<TODAY_STR,isSel=dateStr===selectedDeadline;
    cells+=`<div class="cal-day ${isToday?'today':''} ${isPast?'past':''} ${isSel?'selected':''}" data-date="${dateStr}">${d}</div>`;
  }
  wrap.innerHTML=`<div class="cal-header"><button class="cal-nav" id="cal-prev">‹</button><span class="cal-month">${monthName}</span><button class="cal-nav" id="cal-next">›</button></div><div class="cal-grid">${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-day-label">${d}</div>`).join('')}${cells}</div>`;
  wrap.querySelectorAll('.cal-day:not(.empty):not(.past)').forEach(el=>{
    el.addEventListener('click',()=>{
      selectedDeadline=el.dataset.date;
      // 過去の期限チェック
      if(selectedDeadline<TODAY_STR){showToast('過去の日付は設定できません');selectedDeadline=null;return;}
      const selEl=document.getElementById('deadline-selected');
      if(selEl){selEl.textContent=selectedDeadline;selEl.style.color='var(--accent)';}
      renderDeadlineCalendar();
      if(addState.patternKey)updatePlotInfo();
    });
  });
  wrap.querySelector('#cal-prev')?.addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderDeadlineCalendar();});
  wrap.querySelector('#cal-next')?.addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderDeadlineCalendar();});
}
renderDeadlineCalendar();

function renderPatternList(){
  const list=document.getElementById('pattern-list');if(!list||!addState.type)return;
  const filtered=Object.entries(PATTERNS).filter(([,p])=>p.types.includes(addState.type));
  list.innerHTML=filtered.map(([key,p])=>`<div class="task-card" style="margin-bottom:8px;cursor:pointer;" data-key="${key}"><div style="font-size:13px;font-weight:500;margin-bottom:4px;">${p.name}</div><div style="font-size:11px;color:var(--text3);">${p.baseMin}min〜 / ${p.subtasks.length}ステップ</div></div>`).join('');
  list.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('click',()=>{
      addState.patternKey=el.dataset.key;
      const p=PATTERNS[addState.patternKey];
      addState.count=1;addState.subtasks=[...p.subtasks.map(s=>({...s}))];addState.totalMin=p.baseMin;
      document.getElementById('count-val').textContent='1';
      document.getElementById('step-pattern').style.display='none';
      const hasCount=p.countable;
      document.getElementById('step-count').style.display=hasCount?'block':'none';
      renderSubtaskPreview();
      document.getElementById('step-preview').style.display='block';
      updatePlotInfo();
      document.getElementById('step-plot').style.display='block';
    });
  });
}

async function saveTask(data){
  const{data:task,error}=await db.from('tasks').insert({
    user_id:currentUser.id,title:data.title,type:data.type||'judgment',status:'pending',
    estimated_minutes:data.estimated_minutes||30,deadline:data.deadline||null,
    scheduled_date:null,scheduled_time:null, // 未分配で追加
    pinned:false,date_pinned:false,
    repeat:data.repeat||'none',
    repeat_origin:data.repeat&&data.repeat!=='none'?TODAY_STR:null
  }).select().single();
  if(error){showToast('追加に失敗しました');return;}
  task.scheduled_date=normalizeDate(task.scheduled_date);
  allTasks.unshift(task);
  if(data.subtasks?.length){
    const subs=data.subtasks.map((s,i)=>({task_id:task.id,title:s.title,estimated_minutes:s.minutes||s.estimated_minutes||15,status:'pending',sort_order:i}));
    const{data:savedSubs}=await db.from('subtasks').insert(subs).select();
    if(savedSubs)allSubtasks.push(...savedSubs);
  }
  markOptimizeNeeded();
  renderUnplacedBanner();
}

async function loadAll(){
  const[{data:tasks},{data:subtasks},{data:blocks}]=await Promise.all([
    db.from('tasks').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}),
    db.from('subtasks').select('*').order('sort_order'),
    db.from('blocks').select('*').eq('user_id',currentUser.id).order('start_time')
  ]);
  allTasks=(tasks||[]).map(t=>({...t,scheduled_date:normalizeDate(t.scheduled_date),date_pinned:t.date_pinned||false}));
  allSubtasks=subtasks||[];
  allBlocks=(blocks||[]).map(b=>({...b,_is_absence:b._is_absence||false}));

  // 起動時処理
  // ① 日付固定タスクの期限切れを今日に移動・固定解除
  const overdueFixed=allTasks.filter(t=>{
    if(!t.date_pinned||t.status==='done')return false;
    if(!t.deadline)return false;
    const dl=Math.ceil((new Date(t.deadline)-TODAY)/(1000*60*60*24));
    return dl<=0&&t.scheduled_date!==TODAY_STR;
  });
  for(const t of overdueFixed){
    await db.from('tasks').update({scheduled_date:TODAY_STR,scheduled_time:null,date_pinned:false}).eq('id',t.id);
    t.scheduled_date=TODAY_STR;t.scheduled_time=null;t.date_pinned=false;
  }

  // ② 繰り返しタスクの繰り越し（過去日付→今日以降に移動）
  const repeatOverdue=allTasks.filter(t=>t.status==='pending'&&t.repeat&&t.repeat!=='none'&&t.scheduled_date&&t.scheduled_date<TODAY_STR);
  for(const t of repeatOverdue){
    await db.from('tasks').update({scheduled_date:TODAY_STR,scheduled_time:null}).eq('id',t.id);
    t.scheduled_date=TODAY_STR;t.scheduled_time=null;
  }

  // 未配置タスクがあれば最適化必要フラグを立てる
  const unplaced=allTasks.filter(t=>t.status==='pending'&&!t.scheduled_date);
  if(unplaced.length||overdueFixed.length||repeatOverdue.length)markOptimizeNeeded();

  renderToday();
  renderSetup();
}

function navigateTo(page){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll(`[data-page="${page}"]`).forEach(n=>n.classList.add('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  if(page==='add')initAddPage();
  if(page==='plan')renderPlan();
  if(page==='today')renderToday();
  if(page==='setup')renderSetup();
}

  const errEl=document.getElementById('auth-err');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='メールとパスワードを入力してください';return;}
  let error;
  if(authMode==='login'){({error}=await db.auth.signInWithPassword({email,password}));}
  else{({error}=await db.auth.signUp({email,password}));}
  if(error){errEl.textContent=error.message;return;}
});

document.getElementById('logout-btn').addEventListener('click',async()=>{
  await db.auth.signOut();
  currentUser=null;
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
});

db.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    currentUser=session.user;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    const d=new Date();
    document.getElementById('header-date').textContent=`${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`;
    await loadAll();
  } else {
    currentUser=null;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});
</script>
</body>
</html>
