<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TORA TODO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #FDFAF7; --bg2: #F2EDE6; --bg3: #EBE5DC;
  --accent: #C4603A; --accent-light: #C4603A14;
  --green: #2D3B2E; --text: #2D3B2E; --text2: #6B7B6C; --text3: #9AA59B;
  --white: #ffffff; --sep: rgba(45,59,46,0.08);
  --radius: 12px; --radius-sm: 8px;
  --font: 'DM Sans', -apple-system, sans-serif;
  --font-num: 'Bebas Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; margin: 0 auto; }

/* PC LAYOUT */
.pc-layout { display: flex; flex-direction: column; height: 100vh; }
@media (min-width: 900px) {
  #app { flex-direction: column; }
  .app-body { display: grid; grid-template-columns: 1fr 320px; flex: 1; overflow: hidden; }
  .main { padding: 20px 24px 24px; overflow-y: auto; }
  .right-panel { border-left: 0.5px solid var(--sep); background: var(--white); overflow-y: auto; padding: 20px 20px 24px; }
  .nav { display: none; }
  .pc-nav { display: flex !important; }
  .main { padding-bottom: 24px; }
}
.pc-nav { display: none; gap: 4px; }
.pc-nav-item { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text3); font-weight: 500; transition: all .15s; border: none; background: none; font-family: var(--font); }
.pc-nav-item:hover { background: var(--bg2); color: var(--text); }
.pc-nav-item.active { background: var(--accent-light); color: var(--accent); }
.pc-nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

/* WEEK VIEW */
.week-view { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 4px; }
.week-day-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.week-day-header { font-size: 10px; font-weight: 500; text-align: center; padding: 5px 0; border-radius: 6px; color: var(--text3); letter-spacing: .04em; }
.week-day-header.today { background: var(--accent-light); color: var(--accent); }
.week-task-block { border-radius: 5px; padding: 4px 6px; font-size: 10px; line-height: 1.3; cursor: pointer; transition: opacity .15s; }
.week-task-block:hover { opacity: .8; }
.week-task-block.wt-unknown { background: #C4603A16; color: #C4603A; border-left: 2px solid #C4603A; }
.week-task-block.wt-routine { background: #2D3B2E10; color: #2D3B2E; border-left: 2px solid #2D3B2E; }
.week-task-block.wt-judgment { background: #4A6FA514; color: #4A6FA5; border-left: 2px solid #4A6FA5; }
.week-task-block.wt-dependent { background: #B5566A14; color: #B5566A; border-left: 2px solid #B5566A; }
.week-task-block.wt-block { background: var(--bg3); color: var(--text3); border-left: 2px solid var(--text3); }
.week-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 8px 0; opacity: .5; }

/* CONFLICT BANNER */
.conflict-banner { background: #FFF3E0; border: 0.5px solid #FFCC80; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
.conflict-banner-text { font-size: 13px; color: #E65100; flex: 1; line-height: 1.5; }
.conflict-banner-actions { display: flex; gap: 6px; margin-top: 6px; }
.btn-conflict { font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-family: var(--font); border: 0.5px solid; }
.btn-conflict-move { background: #E65100; color: white; border-color: #E65100; }
.btn-conflict-keep { background: var(--white); color: #E65100; border-color: #FFCC80; }

/* SHORTCUT HINT */
.shortcut-hint { font-size: 10px; color: var(--text3); letter-spacing: .06em; margin-top: 4px; }
kbd { display: inline-block; padding: 1px 5px; border: 0.5px solid var(--bg3); border-radius: 3px; font-size: 10px; font-family: var(--font); background: var(--bg2); color: var(--text2); }

/* AUTH */
#auth-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
.auth-logo { font-family: var(--font-num); font-size: 44px; color: var(--accent); letter-spacing: .05em; margin-bottom: 4px; }
.auth-sub { font-size: 11px; color: var(--text3); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 40px; }
.auth-card { background: var(--white); border-radius: var(--radius); border: 0.5px solid var(--sep); padding: 28px 24px; width: 100%; max-width: 360px; }
.auth-title { font-size: 14px; font-weight: 500; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 6px; }
.field input { width: 100%; height: 42px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--bg); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.field input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; transition: opacity .2s; }
.btn-primary:active { opacity: .8; }
.auth-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text3); }
.auth-toggle a { color: var(--accent); cursor: pointer; }
.auth-err { font-size: 12px; color: var(--accent); margin-top: 10px; text-align: center; min-height: 18px; }

/* APP */
#app { display: none; flex-direction: column; height: 100vh; }
.header { position: sticky; top: 0; z-index: 100; background: rgba(253,250,247,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0.5px solid var(--sep); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
.header-logo { font-family: var(--font-num); font-size: 22px; color: var(--accent); letter-spacing: .06em; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-date { font-size: 11px; color: var(--text3); }
.btn-logout { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font); }
.main { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }
.app-body { display: flex; flex: 1; overflow: hidden; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(242,237,230,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 0.5px solid var(--sep); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 14px; border-radius: 8px; }
.nav-item:active { background: var(--bg3); }
.nav-icon { width: 22px; height: 22px; }
.nav-label { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); font-weight: 500; }
.nav-item.active .nav-label { color: var(--accent); }

/* PAGE */
.page { display: none; }
.page.active { display: block; }

/* LABELS */
.sec-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); font-weight: 500; margin-bottom: 10px; margin-top: 20px; }
.sec-label:first-child { margin-top: 4px; }

/* BUFFER BAR */
.buffer-bar { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 4px; }
.buffer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.buffer-label { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; }
.buffer-nums { font-family: var(--font-num); font-size: 14px; color: var(--text2); letter-spacing: .04em; }
.buffer-nums span { color: var(--accent); }
.buffer-track { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.buffer-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.buffer-fill.warn { background: #E8433A; }

/* NEXT ACTION */
.next-action { background: var(--accent); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.next-action-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 4px; }
.next-action-title { font-size: 15px; font-weight: 500; color: white; }
.next-action-meta { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 2px; }
.next-action-icon { width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* GOALS */
.goals-wrap { display: flex; flex-direction: column; gap: 6px; }
.goal-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.goal-circle { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; }
.goal-circle.done { background: var(--accent); border-color: var(--accent); }
.goal-text { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
.goal-text.done { color: var(--text3); text-decoration: line-through; }
.goal-del { width: 16px; height: 16px; cursor: pointer; opacity: .25; flex-shrink: 0; }
.goal-add { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); border: 0.5px dashed var(--bg3); cursor: pointer; margin-top: 6px; transition: background .15s; }
.goal-add:hover { background: var(--bg2); }
.goal-add-text { font-size: 13px; color: var(--text3); }

/* SCHEDULE */
.sched-row { display: flex; gap: 12px; align-items: flex-start; padding: 4px 0; }
.sched-time { font-family: var(--font-num); font-size: 13px; color: var(--text3); width: 44px; flex-shrink: 0; padding-top: 3px; letter-spacing: .04em; }
.sched-line { display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
.sched-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.sched-dot.block-dot { background: var(--text3); }
.sched-connector { width: 1px; background: var(--sep); flex: 1; min-height: 20px; margin-top: 3px; }
.sched-content { flex: 1; padding-bottom: 8px; }

/* TASK CARD */
.task-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px; cursor: pointer; transition: background .15s; }
.task-card:active { background: var(--bg2); }
.task-card.done { opacity: .45; }
.task-card.block-card { background: var(--bg2); cursor: default; }
.task-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.task-card-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.task-type-badge { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; font-weight: 500; }
.type-routine { background: #2D3B2E12; color: #2D3B2E; }
.type-unknown { background: #C4603A16; color: #C4603A; }
.type-judgment { background: #4A6FA516; color: #4A6FA5; }
.type-dependent { background: #B5566A16; color: #B5566A; }
.type-block { background: var(--bg3); color: var(--text3); }
.task-title { font-size: 13px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-time { font-family: var(--font-num); font-size: 13px; color: var(--text3); letter-spacing: .04em; flex-shrink: 0; }
.task-card-bottom { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.task-min { font-size: 11px; color: var(--text3); }
.task-deadline { font-size: 11px; color: var(--accent); }

/* SUBTASK */
.subtask-list { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--sep); display: flex; flex-direction: column; gap: 4px; }
.subtask-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
.subtask-check { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--bg3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.subtask-check.done { background: var(--accent); border-color: var(--accent); }
.subtask-title { font-size: 12px; color: var(--text2); flex: 1; }
.subtask-title.done { color: var(--text3); text-decoration: line-through; }
.subtask-min { font-size: 11px; color: var(--text3); font-family: var(--font-num); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(45,59,46,.18); display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 0 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.32,1,.23,1); max-height: 92vh; overflow-y: auto; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 12px auto 20px; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 20px; }

/* INPUT MODE TABS */
.mode-tabs { display: flex; background: var(--bg2); border-radius: var(--radius-sm); padding: 3px; gap: 3px; margin-bottom: 20px; }
.mode-tab { flex: 1; height: 36px; border: none; border-radius: 6px; font-size: 13px; font-family: var(--font); cursor: pointer; background: none; color: var(--text3); font-weight: 500; transition: all .2s; }
.mode-tab.active { background: var(--white); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* QUICK INPUT */
.quick-wrap { display: flex; flex-direction: column; gap: 12px; }
.quick-input-row { display: flex; gap: 8px; }
.quick-input { flex: 1; height: 48px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); padding: 0 14px; font-size: 15px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.quick-input:focus { border-color: var(--accent); }
.btn-ai { height: 48px; padding: 0 18px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; white-space: nowrap; transition: opacity .2s; display: flex; align-items: center; gap: 6px; }
.btn-ai:active { opacity: .8; }
.ai-result { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 14px; }
.ai-result-title { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
.ai-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 0.5px solid var(--sep); }
.ai-row:last-of-type { border-bottom: none; }
.ai-row-label { font-size: 12px; color: var(--text3); }
.ai-row-val { font-size: 13px; color: var(--text); font-weight: 500; }
.ai-subtasks { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--sep); }
.ai-subtask-item { font-size: 12px; color: var(--text2); padding: 4px 0; display: flex; justify-content: space-between; }
.ai-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn-ok { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-edit { height: 44px; padding: 0 18px; background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); color: var(--text2); cursor: pointer; }
.ai-loading { display: flex; align-items: center; gap: 10px; padding: 16px; color: var(--text3); font-size: 13px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--bg3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* WIZARD */
.wiz-q { font-size: 16px; font-weight: 500; margin-bottom: 6px; line-height: 1.5; }
.wiz-sub { font-size: 13px; color: var(--text3); margin-bottom: 20px; line-height: 1.5; }
.wiz-options { display: flex; flex-direction: column; gap: 8px; }
.wiz-opt { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 10px; }
.wiz-opt:active, .wiz-opt.sel { background: var(--bg2); border-color: var(--accent); }
.wiz-opt-text { font-size: 14px; font-weight: 500; }
.wiz-opt-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
.wiz-input-wrap { margin-bottom: 14px; }
.wiz-label { font-size: 11px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.wiz-input { width: 100%; height: 44px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); padding: 0 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color .2s; }
.wiz-input:focus { border-color: var(--accent); }
.wiz-input-lg { height: auto; padding: 10px 12px; resize: none; }
.wiz-row { display: flex; gap: 10px; }
.wiz-row .wiz-input-wrap { flex: 1; }
.wiz-nav { display: flex; gap: 8px; margin-top: 20px; }
.btn-back { height: 44px; padding: 0 18px; border: 0.5px solid var(--bg3); border-radius: var(--radius-sm); background: var(--white); font-size: 14px; font-family: var(--font); color: var(--text2); cursor: pointer; }
.btn-next { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.decompose-preview { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; }
.decompose-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--sep); font-size: 13px; color: var(--text); }
.decompose-item:last-child { border-bottom: none; }
.decompose-min { font-size: 12px; color: var(--text3); font-family: var(--font-num); }

/* TIME SLOTS */
.time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.time-slot { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); padding: 8px 6px; cursor: pointer; text-align: center; transition: all .15s; }
.time-slot:hover, .time-slot.selected { border-color: var(--accent); background: var(--accent-light); }
.time-slot-time { font-family: var(--font-num); font-size: 15px; color: var(--accent); }
.time-slot-label { font-size: 10px; color: var(--text3); margin-top: 1px; }
.time-slot.taken { opacity: .4; cursor: not-allowed; }
.time-slot.taken:hover { border-color: var(--sep); background: var(--white); }

/* DETAIL MODAL */
.detail-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn-done { flex: 1; height: 44px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; }
.btn-carry { flex: 1; height: 44px; background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); color: var(--text2); cursor: pointer; }
.btn-delete { height: 44px; padding: 0 14px; background: none; border: 0.5px solid #C4603A35; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); color: var(--accent); cursor: pointer; }

/* CHIPS */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-family: var(--font); border: 0.5px solid var(--sep); background: var(--white); color: var(--text2); cursor: pointer; transition: all .15s; }
.chip.selected { background: var(--accent); color: white; border-color: var(--accent); }

/* REVIEW */
.review-card { background: var(--white); border: 0.5px solid var(--sep); border-radius: var(--radius); padding: 13px; margin-bottom: 8px; }
.review-card-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
.review-card-sub { font-size: 12px; color: var(--text3); }
.review-action { display: flex; gap: 6px; margin-top: 10px; }
.btn-sm { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-family: var(--font); cursor: pointer; border: 0.5px solid var(--sep); background: var(--bg2); color: var(--text2); }
.btn-sm-accent { background: var(--accent); color: white; border-color: var(--accent); }

/* EMPTY */
.empty { text-align: center; padding: 36px 20px; color: var(--text3); font-size: 13px; line-height: 1.8; }

/* TOAST */

function fmt(d) { return `${d.getMonth()+1}/${d.getDate()} (${DAYS[d.getDay()]})`; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function typeLabel(type) { return { routine: 'ルーティン', unknown: '初めて', judgment: '判断', dependent: '他者依存', block: '固定' }[type] || type; }

// AUTH
let authMode = 'login';
document.getElementById('auth-btn').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-err');
  err.textContent = '';
  if (!email || !pw) { err.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  if (authMode === 'login') {
    const { error } = await db.auth.signInWithPassword({ email, password: pw });
    if (error) err.textContent = 'ログインに失敗しました';
  } else {
    const { error } = await db.auth.signUp({ email, password: pw });
    if (error) err.textContent = error.message;
    else err.textContent = '確認メールを送信しました';
  }
});
document.getElementById('auth-toggle-link').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';

  document.getElementById('auth-toggle-text').textContent = authMode === 'login' ? 'アカウントがない方は' : 'すでにアカウントがある方は';
  document.getElementById('auth-toggle-link').textContent = authMode === 'login' ? '新規登録' : 'ログイン';
});
document.getElementById('logout-btn').addEventListener('click', () => db.auth.signOut());
db.auth.onAuthStateChange((event, session) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('header-date').textContent = fmt(TODAY);
    document.getElementById('block-date').value = TODAY_STR;
    loadAll();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

// LOAD
async function loadAll() {
  const [{ data: tasks }, { data: subtasks }, { data: blocks }, { data: goals }] = await Promise.all([
    db.from('tasks').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }),
    db.from('subtasks').select('*').order('sort_order'),
    db.from('blocks').select('*').eq('user_id', currentUser.id).order('start_time'),
    db.from('daily_goals').select('*').eq('user_id', currentUser.id).eq('date', TODAY_STR).order('sort_order')
  ]);
  allTasks = tasks || []; allSubtasks = subtasks || []; allBlocks = blocks || []; todayGoals = goals || [];
  checkPCLayout();
  renderToday();
}

// NAV（モバイル＋PC共通）
function navigateTo(page) {
  document.querySelectorAll('.nav-item, .pc-nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll(`[data-page="${page}"]`).forEach(n => n.classList.add('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'add') { initAddPage(); }
  if (page === 'list') renderTaskList();
  if (page === 'tomorrow') renderTomorrow();
  if (page === 'today') renderToday();
}
document.querySelectorAll('.nav-item, .pc-nav-item').forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.page));
});

// PCレイアウト検知
function checkPCLayout() {
  const isPC = window.innerWidth >= 900;
  const rightPanel = document.getElementById('right-panel');
  rightPanel.style.display = isPC ? 'block' : 'none';
  const mainContent = document.getElementById('main-content');
  mainContent.style.maxWidth = isPC ? 'none' : '480px';
  if (isPC) renderWeekView();
}
window.addEventListener('resize', checkPCLayout);

// 週間ビュー
function renderWeekView() {
  const wrap = document.getElementById('week-view');
  if (!wrap) return;
  const mon = new Date(TODAY);
  mon.setDate(TODAY.getDate() - ((TODAY.getDay() + 6) % 7));
  wrap.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const day = new Date(mon);
    day.setDate(mon.getDate() + i);
    const dStr = day.toISOString().split('T')[0];
    const isToday = dStr === TODAY_STR;
    const dayTasks = allTasks.filter(t => t.scheduled_date === dStr && t.status !== 'done');
    const dayBlocks = allBlocks.filter(b => b.date === dStr);
    const col = document.createElement('div');
    col.className = 'week-day-col';
    col.innerHTML = `<div class="week-day-header${isToday ? ' today' : ''}">${DAYS[day.getDay()]} ${day.getDate()}</div>`;
    dayBlocks.forEach(b => {
      const div = document.createElement('div');
      div.className = 'week-task-block wt-block';
      div.textContent = b.title;
      col.appendChild(div);
    });
    if (!dayTasks.length && !dayBlocks.length) {
      const emp = document.createElement('div');
      emp.className = 'week-empty'; emp.textContent = '−';
      col.appendChild(emp);
    }
    dayTasks.forEach(t => {
      const div = document.createElement('div');
      div.className = `week-task-block wt-${t.type}`;
      div.textContent = t.title;
      div.addEventListener('click', () => openDetail(t.id));
      col.appendChild(div);
    });
    wrap.appendChild(col);
  }
  renderBlockListRight();
}

function renderBlockListRight() {
  const wrap = document.getElementById('block-list-right');
  if (!wrap) return;
  const todayBlocks = allBlocks.filter(b => b.date === TODAY_STR);
  wrap.innerHTML = todayBlocks.length
    ? todayBlocks.map(b => `<div class="task-card block-card" style="margin-bottom:6px;cursor:default;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-block">固定</div><span class="task-title">${b.title}</span></div><span class="task-time">${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span></div></div>`).join('')
    : '<div style="font-size:12px;color:var(--text3);padding:4px 0;">今日の会議なし</div>';
}

document.getElementById('add-block-right-btn')?.addEventListener('click', () => {
  document.getElementById('block-date').value = TODAY_STR;
  openModal('block-modal');
});

// 衝突検知・提案
function checkConflicts() {
  const area = document.getElementById('conflict-area');
  if (!area) return;
  const conflicts = [];
  allTasks.filter(t => t.scheduled_date === TODAY_STR && t.scheduled_time && t.status === 'pending').forEach(task => {
    const [th, tm] = task.scheduled_time.split(':').map(Number);
    const taskStart = th * 60 + tm;
    const taskEnd = taskStart + (task.estimated_minutes || 30);
    allBlocks.filter(b => b.date === TODAY_STR).forEach(block => {
      const [bsh, bsm] = block.start_time.split(':').map(Number);
      const [beh, bem] = block.end_time.split(':').map(Number);
      const blockStart = bsh * 60 + bsm;
      const blockEnd = beh * 60 + bem;
      if (taskStart < blockEnd && taskEnd > blockStart) {
        conflicts.push({ task, block });
      }
    });
  });
  if (!conflicts.length) { area.innerHTML = ''; return; }
  area.innerHTML = conflicts.map(({ task, block }) => `
    <div class="conflict-banner">
      <div style="flex:1;">
        <div class="conflict-banner-text">「${task.title}」が「${block.title}」(${block.start_time.slice(0,5)}〜${block.end_time.slice(0,5)})と重なっています</div>
        <div class="conflict-banner-actions">
          <button class="btn-conflict btn-conflict-move" onclick="moveConflictTask('${task.id}')">空き枠に移動</button>
          <button class="btn-conflict btn-conflict-keep" onclick="dismissConflict(this)">このままにする</button>
        </div>
      </div>
    </div>
  `).join('');
}

window.moveConflictTask = async function(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const newTime = autoPlotTime(task.type, task.estimated_minutes, TODAY_STR);
  await db.from('tasks').update({ scheduled_time: newTime }).eq('id', taskId);
  task.scheduled_time = newTime;
  renderToday();
  showToast(`${task.title}を${newTime}に移動しました`);
};
window.dismissConflict = function(btn) {
  btn.closest('.conflict-banner').remove();

function renderBuffer() {
  const wrap = document.getElementById('buffer-wrap');
  const todayTasks = allTasks.filter(t => t.scheduled_date === TODAY_STR && t.status !== 'done');
  const todayBlocks = allBlocks.filter(b => b.date === TODAY_STR);
  const totalTaskMin = todayTasks.reduce((a,t) => a + (t.estimated_minutes||0), 0);
  const totalBlockMin = todayBlocks.reduce((b,bl) => {
    const [sh,sm] = bl.start_time.split(':').map(Number);
    const [eh,em] = bl.end_time.split(':').map(Number);
    return b + (eh*60+em - sh*60-sm);
  }, 0);
  const workMin = 8 * 60;
  const usedMin = totalTaskMin + totalBlockMin;
  const pct = Math.min(100, Math.round(usedMin / workMin * 100));
  const remaining = workMin - usedMin;
  wrap.innerHTML = `
    <div class="buffer-bar">
      <div class="buffer-top">
        <span class="buffer-label">今日の使用時間</span>
        <span class="buffer-nums"><span>${usedMin}</span>/${workMin}min</span>
      </div>
      <div class="buffer-track"><div class="buffer-fill ${pct > 85 ? 'warn' : ''}" style="width:${pct}%"></div></div>
    </div>
  `;
}

// AUTO PLOT - 空き枠を計算してタスクを配置
function getAvailableSlots(date) {
  const WORK_START = 9 * 60, WORK_END = 18 * 60;
  const blockedRanges = allBlocks.filter(b => b.date === date).map(b => {
    const [sh,sm] = b.start_time.split(':').map(Number);
    const [eh,em] = b.end_time.split(':').map(Number);
    return { start: sh*60+sm, end: eh*60+em };
  });
  const scheduled = allTasks.filter(t => t.scheduled_date === date && t.scheduled_time && t.status !== 'done').map(t => {
    const [h,m] = t.scheduled_time.split(':').map(Number);
    return { start: h*60+m, end: h*60+m+(t.estimated_minutes||30) };
  });
  const busy = [...blockedRanges, ...scheduled].sort((a,b) => a.start - b.start);
  const slots = [];
  let cursor = WORK_START;
  for (const b of busy) {
    if (cursor < b.start) slots.push({ start: cursor, end: b.start });
    cursor = Math.max(cursor, b.end);
  }
  if (cursor < WORK_END) slots.push({ start: cursor, end: WORK_END });
  return slots;
}

function autoPlotTime(type, estimatedMin, date) {
  const slots = getAvailableSlots(date);
  // 集中枠（16:00以降）優先：unknown, judgment
  const prefersConcentration = ['unknown', 'judgment'].includes(type);
  const CONCENTRATION_START = 16 * 60;
  const candidates = prefersConcentration
    ? [...slots.filter(s => s.start >= CONCENTRATION_START), ...slots.filter(s => s.start < CONCENTRATION_START)]
    : slots;
  for (const slot of candidates) {
    if (slot.end - slot.start >= estimatedMin) {
      const h = Math.floor(slot.start / 60);
      const m = slot.start % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }
  }
  return '09:00';
}

// GEMINI AI
async function analyzeWithGemini(title) {
  const prompt = `あなたは仕事タスク分析の専門家です。以下のタスクを分析して、JSON形式で返してください。

タスク名：「${title}」

以下のJSON形式のみを返してください（説明不要）：
{
  "type": "routine" | "unknown" | "judgment" | "dependent",
  "estimated_minutes": 数値（5〜240）,
  "decompose_pattern": null | "research" | "confirm" | "find_resource" | "fully_unknown" | "multi_person" | "approval" | "material" | "judgment",
  "subtasks": [{"title": "サブタスク名", "minutes": 数値}],
  "reason": "判断理由を一文で"
}

判断基準：
- routine: 毎回同じ手順で繰り返す作業（報告書作成、定期連絡など）
- unknown: 初めてまたは初めて要素がある（企画、新規提案など）
- judgment: 意思決定が主目的（方針決定、選定など）
- dependent: 他者のアクションが必要（承認依頼、確認待ちなど）
subtasksはdecompose_patternがnullでない場合のみ設定。`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

    document.getElementById('wn35').addEventListener('click', () => {
      if (!sel.length) { showToast('選択してください'); return; }
      wizardData.patterns = sel;
      if (sel[0] === 'none') { wizardData.type = 'judgment'; wizardData.subtasks = []; renderWizardStep(5); }
      else {
        wizardData.type = 'unknown';
        const subs = []; sel.forEach(p => (DECOMPOSE_PATTERNS[p]||[]).forEach(s => subs.push({...s})));
        wizardData.subtasks = subs;
        renderWizardStep(4);
      }
    });
  } else if (step === 4) {
    const subs = wizardData.subtasks || [];
    const total = subs.reduce((a,s) => a + s.minutes, 0) || 30;
    wizardData.estimated_minutes = total;
    c.innerHTML = `
      <div class="wiz-q">分解結果</div>
      <div class="wiz-sub">このステップで進めます</div>
      ${subs.length ? `<div class="decompose-preview">${subs.map(s => `<div class="decompose-item"><span>${s.title}</span><span class="decompose-min">${s.minutes}min</span></div>`).join('')}<div style="text-align:right;font-size:12px;color:var(--accent);margin-top:8px;font-family:var(--font-num);">合計 ${total}min</div></div>` : ''}
      <div class="wiz-nav"><button class="btn-back" id="wb4">戻る</button><button class="btn-next" id="wn4">次へ →</button></div>
    `;
    document.getElementById('wb4').addEventListener('click', () => renderWizardStep(wizardData.type === 'dependent' ? 3 : 3.5));
    document.getElementById('wn4').addEventListener('click', () => renderWizardStep(5));
  } else if (step === 5) {
    const defMin = wizardData.estimated_minutes || (wizardData.type === 'routine' ? 30 : 45);
    const autoTime = autoPlotTime(wizardData.type || 'judgment', defMin, TODAY_STR);
    c.innerHTML = `
      <div class="wiz-q">スケジュール設定</div>
      <div class="wiz-row">
        <div class="wiz-input-wrap"><label class="wiz-label">所要時間（分）</label><input class="wiz-input" type="number" id="wiz-min" value="${defMin}" min="5" max="480" step="5"></div>
        <div class="wiz-input-wrap"><label class="wiz-label">期限（任意）</label><input class="wiz-input" type="date" id="wiz-deadline" value="${wizardData.deadline||''}"></div>
      </div>
      <div class="wiz-input-wrap">
        <label class="wiz-label">今日やる？</label>
        <select class="wiz-input" id="wiz-today-flag">
          <option value="yes">今日スケジュールに入れる</option>
          <option value="no">後日やる（一覧に追加）</option>
        </select>
      </div>
      <div id="slot-section">
        <label class="wiz-label">開始時刻（自動: ${autoTime}）</label>
        <div class="time-slots" id="slot-grid"></div>
      </div>
      <div class="wiz-nav"><button class="btn-back" id="wb5">戻る</button><button class="btn-next" id="wn5">保存する</button></div>
    `;
    wizardData.scheduled_time = autoTime;
    const takenTimes = allTasks.filter(t => t.scheduled_date === TODAY_STR && t.scheduled_time).map(t => t.scheduled_time.slice(0,5));
    const slots = ['09:00','09:30','10:00','10:30','11:00','11:30','13:00','14:00','15:00','16:00','16:30','17:00','17:30'];
    const grid = document.getElementById('slot-grid');
    slots.forEach(s => {
      const d = document.createElement('div');
      const isTaken = takenTimes.includes(s);
      d.className = `time-slot${isTaken ? ' taken' : ''}${s === autoTime ? ' selected' : ''}`;
      const [h] = s.split(':');
      const label = parseInt(h) < 12 ? '午前' : parseInt(h) < 16 ? '午後' : '集中枠';
      d.innerHTML = `<div class="time-slot-time">${s}</div><div class="time-slot-label">${label}</div>`;
      if (!isTaken) d.addEventListener('click', () => {
        document.querySelectorAll('.time-slot').forEach(x => x.classList.remove('selected'));
        d.classList.add('selected');
        wizardData.scheduled_time = s;
      });
      grid.appendChild(d);
    });
    document.getElementById('wiz-today-flag').addEventListener('change', function() {
      document.getElementById('slot-section').style.display = this.value === 'yes' ? 'block' : 'none';
    });
    const backStep = wizardData.type === 'routine' ? 2 : (wizardData.subtasks?.length ? 4 : 3.5);
    document.getElementById('wb5').addEventListener('click', () => renderWizardStep(backStep));
    document.getElementById('wn5').addEventListener('click', async () => {
      wizardData.estimated_minutes = parseInt(document.getElementById('wiz-min').value) || 30;
      wizardData.deadline = document.getElementById('wiz-deadline').value || null;
      const todayFlag = document.getElementById('wiz-today-flag').value;
      wizardData.scheduled_date = todayFlag === 'yes' ? TODAY_STR : null;
      if (todayFlag !== 'yes') wizardData.scheduled_time = null;
      await saveTask(wizardData);
    });
  }
}

async function saveTask(data) {
  const { data: task, error } = await db.from('tasks').insert({
    user_id: currentUser.id, title: data.title, type: data.type || 'judgment',
    status: 'pending', estimated_minutes: data.estimated_minutes || 30,
    deadline: data.deadline || null, scheduled_date: data.scheduled_date || null,
    scheduled_time: data.scheduled_time || null, memo: data.memo || null
  }).select().single();
  if (error) { showToast('保存に失敗しました'); return; }
  allTasks.unshift(task);
  if (data.subtasks?.length) {
    const subs = data.subtasks.map((s, i) => ({ task_id: task.id, title: s.title, estimated_minutes: s.minutes || s.estimated_minutes || 30, status: 'pending', sort_order: i }));
    const { data: saved } = await db.from('subtasks').insert(subs).select();
    if (saved) allSubtasks.push(...saved);
  }
  showToast('タスクを追加しました 🐯');
  aiResult = null; wizardData = {};
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('[data-page="today"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-today').classList.add('active');
  renderToday();
}

// DETAIL MODAL
function openDetail(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  const subs = allSubtasks.filter(s => s.task_id === taskId);
  const body = document.getElementById('detail-body');
  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <div class="task-type-badge type-${task.type}">${typeLabel(task.type)}</div>
      <span style="font-size:16px;font-weight:500;">${task.title}</span>
    </div>
    <div style="display:flex;gap:16px;margin-bottom:14px;">
      <div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">所要時間</div><div style="font-family:var(--font-num);font-size:22px;color:var(--accent);">${task.estimated_minutes}<span style="font-size:11px;">min</span></div></div>
      ${task.scheduled_time ? `<div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">開始時刻</div><div style="font-family:var(--font-num);font-size:22px;color:var(--text2);">${task.scheduled_time.slice(0,5)}</div></div>` : ''}
      ${task.deadline ? `<div><div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;">期限</div><div style="font-size:13px;color:var(--accent);margin-top:6px;">${task.deadline}</div></div>` : ''}
    </div>
    ${subs.length ? `<div style="font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">サブタスク</div><div class="subtask-list" style="margin-top:0;padding-top:0;border-top:none;">${subs.map(s => `<div class="subtask-item"><div class="subtask-check ${s.status==='done'?'done':''}" data-sub-id="${s.id}">${s.status==='done'?`<svg width="7" height="7" viewBox="0 0 7 7"><polyline points="1,3.5 2.8,5.5 6,1.5" stroke="white" stroke-width="1.5" fill="none"/></svg>`:''}</div><span class="subtask-title ${s.status==='done'?'done':''}">${s.title}</span><span class="subtask-min">${s.estimated_minutes}min</span></div>`).join('')}</div>` : ''}
    ${task.memo ? `<div style="margin-top:12px;font-size:13px;color:var(--text2);line-height:1.6;background:var(--bg2);border-radius:8px;padding:10px 12px;">${task.memo}</div>` : ''}
    <div class="detail-actions">
      <button class="btn-done" id="dd-btn">完了</button>
      <button class="btn-carry" id="dc-btn">明日に持ち越し</button>
      <button class="btn-delete" id="ddel-btn">削除</button>
    </div>
  `;
  body.querySelectorAll('.subtask-check').forEach(el => el.addEventListener('click', () => toggleSubtask(el.dataset.subId)));
  document.getElementById('dd-btn').addEventListener('click', async () => { await toggleTask(taskId); closeModal('detail-modal'); });
  document.getElementById('dc-btn').addEventListener('click', async () => {
    const tm = new Date(TODAY); tm.setDate(tm.getDate()+1);
    const tStr = tm.toISOString().split('T')[0];
    const autoTime = autoPlotTime(task.type, task.estimated_minutes, tStr);
    await db.from('tasks').update({ status: 'carried', scheduled_date: tStr, scheduled_time: autoTime }).eq('id', taskId);
    const t = allTasks.find(x => x.id === taskId);
    if (t) { t.status = 'carried'; t.scheduled_date = tStr; t.scheduled_time = autoTime; }
    closeModal('detail-modal'); renderToday(); showToast('明日に持ち越しました');
  });
  document.getElementById('ddel-btn').addEventListener('click', async () => {
    if (!confirm('削除しますか？')) return;
    await db.from('tasks').delete().eq('id', taskId);
    allTasks = allTasks.filter(t => t.id !== taskId);
    allSubtasks = allSubtasks.filter(s => s.task_id !== taskId);
    closeModal('detail-modal'); renderToday(); showToast('削除しました');
  });
  openModal('detail-modal');
}

// BLOCKS
document.getElementById('add-block-btn').addEventListener('click', () => openModal('block-modal'));
document.getElementById('block-save-btn').addEventListener('click', async () => {
  const title = document.getElementById('block-title').value.trim();
  const start = document.getElementById('block-start').value;
  const end = document.getElementById('block-end').value;
  const date = document.getElementById('block-date').value;
  if (!title || !start || !end) { showToast('内容・時間を入力してください'); return; }
  const { data } = await db.from('blocks').insert({ user_id: currentUser.id, title, start_time: start+':00', end_time: end+':00', date }).select().single();
  if (data) allBlocks.push(data);
  closeModal('block-modal');
  renderTomorrow();
  renderToday();
  if (window.innerWidth >= 900) renderWeekView();
  showToast('固定ブロックを追加しました');
});

function renderTomorrow() {
  const tm = new Date(TODAY); tm.setDate(tm.getDate()+1);
  const tStr = tm.toISOString().split('T')[0];
  const blockList = document.getElementById('block-list');
  const todayBlocks = allBlocks.filter(b => b.date === TODAY_STR);
  blockList.innerHTML = todayBlocks.length ? todayBlocks.map(b => `
    <div class="task-card block-card" style="margin-bottom:6px;">
      <div class="task-card-top">
        <div class="task-card-left"><div class="task-type-badge type-block">固定</div><span class="task-title">${b.title}</span></div>
        <span class="task-time">${b.start_time.slice(0,5)}〜${b.end_time.slice(0,5)}</span>
      </div>
    </div>`).join('') : '<div style="font-size:13px;color:var(--text3);padding:8px 0 12px;">固定ブロックなし</div>';
  const carried = allTasks.filter(t => t.status === 'carried' || (t.status === 'pending' && t.scheduled_date === TODAY_STR));
  const unscheduled = allTasks.filter(t => !t.scheduled_date && t.status === 'pending');
  const carriedList = document.getElementById('carried-list');
  carriedList.innerHTML = carried.length ? carried.map(t => `<div class="task-card" style="margin-bottom:6px;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.estimated_minutes}min</span></div></div>`).join('') : '<div style="font-size:13px;color:var(--text3);padding:8px 0;">持ち越しなし 🎉</div>';
  const unList = document.getElementById('unscheduled-list');
  unList.innerHTML = unscheduled.length ? unscheduled.map(t => `<div class="task-card" style="margin-bottom:6px;"><div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.estimated_minutes}min</span></div></div>`).join('') : '<div style="font-size:13px;color:var(--text3);padding:8px 0;">なし</div>';
  document.getElementById('plot-tomorrow-btn').onclick = async () => {
    const targets = [...carried, ...unscheduled];
    if (!targets.length) { showToast('プロット対象なし'); return; }
    await Promise.all(targets.map(t => {
      const autoTime = autoPlotTime(t.type, t.estimated_minutes, tStr);
      db.from('tasks').update({ scheduled_date: tStr, scheduled_time: autoTime, status: 'pending' }).eq('id', t.id);
      t.scheduled_date = tStr; t.scheduled_time = autoTime; t.status = 'pending';
    }));
    showToast(`${targets.length}件を明日に自動プロットしました`);
    renderTomorrow();
  };
}

// TASK LIST
function renderTaskList() {
  const list = document.getElementById('task-list');
  let tasks = [...allTasks];
  if (currentFilter === 'pending') tasks = tasks.filter(t => t.status === 'pending');
  else if (['routine','unknown','judgment','dependent'].includes(currentFilter)) tasks = tasks.filter(t => t.type === currentFilter);
  if (!tasks.length) { list.innerHTML = '<div class="empty">タスクがありません</div>'; return; }
  list.innerHTML = '';
  tasks.forEach(t => {
    const subs = allSubtasks.filter(s => s.task_id === t.id);
    const card = document.createElement('div');
    card.className = `task-card${t.status==='done'?' done':''}`;
    card.innerHTML = `<div class="task-card-top"><div class="task-card-left"><div class="task-type-badge type-${t.type}">${typeLabel(t.type)}</div><span class="task-title">${t.title}</span></div><span class="task-time">${t.estimated_minutes}min</span></div><div class="task-card-bottom">${t.scheduled_date?`<span class="task-min">${t.scheduled_date}</span>`:''}${t.deadline?`<span class="task-deadline">期限 ${t.deadline}</span>`:''}${subs.length?`<span class="task-min">サブ ${subs.filter(s=>s.status==='done').length}/${subs.length}</span>`:''}</div>`;
    card.addEventListener('click', () => openDetail(t.id));
    list.appendChild(card);
  });
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('selected'));
  c.classList.add('selected');
  currentFilter = c.dataset.filter;
  renderTaskList();
}));

// WEEKLY REVIEW
document.getElementById('review-btn').addEventListener('click', () => {
  const pending = allTasks.filter(t => t.status === 'pending' || t.status === 'carried');
  const body = document.getElementById('review-body');
  body.innerHTML = `<div style="font-size:13px;color:var(--text2);margin-bottom:16px;">未完了 <strong>${pending.length}件</strong> を確認します</div>` +
    (pending.length ? pending.slice(0,15).map(t => `<div class="review-card"><div class="review-card-title">${t.title}</div><div class="review-card-sub">${typeLabel(t.type)} · ${t.estimated_minutes}min</div><div class="review-action"><button class="btn-sm" onclick="moveNextWeek('${t.id}')">来週に移す</button><button class="btn-sm btn-sm-accent" onclick="keepTask('${t.id}')">今週継続</button><button class="btn-sm" style="color:var(--accent);" onclick="dropTask('${t.id}')">削除</button></div></div>`).join('') : '<div class="empty">未完了タスクなし 🎉</div>');
  openModal('review-modal');
});
window.moveNextWeek = async (id) => {
  const nm = new Date(TODAY); nm.setDate(TODAY.getDate() + (8-TODAY.getDay())%7||7);
  const nStr = nm.toISOString().split('T')[0];
  await db.from('tasks').update({ scheduled_date: nStr, status: 'pending' }).eq('id', id);
  const t = allTasks.find(x => x.id === id);
  if (t) { t.scheduled_date = nStr; t.status = 'pending'; }
  showToast('来週に移しました');
  document.getElementById('review-btn').click();
};
window.keepTask = () => showToast('今週継続します');
window.dropTask = async (id) => {
  if (!confirm('削除しますか？')) return;
  await db.from('tasks').delete().eq('id', id);
  allTasks = allTasks.filter(t => t.id !== id);
  showToast('削除しました');
  document.getElementById('review-btn').click();
};

// MODALS CLOSE
['detail-modal','goal-modal','review-modal','block-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) { if (e.target === this) closeModal(id); });
});
document.querySelectorAll('.modal').forEach(m => {
  let sy = 0;
  m.addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, { passive: true });
  m.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - sy > 80) { const o = m.closest('.modal-overlay'); if (o) o.classList.remove('open'); } }, { passive: true });
});
</script>
</body>
</html>
